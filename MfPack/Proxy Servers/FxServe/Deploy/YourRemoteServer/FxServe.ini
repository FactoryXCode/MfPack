[Server]
BindAddress=0.0.0.0
Port=8080
WebRoot=C:\FxServe\www
IndexFile=index.html
MaxConnections=128
HeaderTimeoutMs=10000
SendTimeoutMs=30000

[Push]
Enabled=True
Contact=mailto:admin@localhost
PollIntervalMs=5000
SubscriptionFile=.\FxAlert.subscriptions.dat
VapidKeyFile=.\FxAlert.vapid.dat

[Wan]
Enabled=False
HostName=yourradio.yourhost.com
HttpEnabled=True
HttpPort=80
HttpsEnabled=True
HttpsPort=443
RedirectHttp=True

[Proxy]
Enabled=True
Host=127.0.0.1
Port=8000
Routes=/live,/status,/video.mjpg

[Headers]
Cors=True
NoStoreRoutes=/stream,/video,/nowplaying.json,/fxalert/status.json

[Logging]
File=C:\FxServe\FxServe.log
RetentionDays=14

[Protection]
Enabled=False
RequestsPerMinute=300
Burst=60
MaxConcurrentPerAddress=12
BlockSeconds=60
