<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <title></title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>

    :root {
      --bg: #02070d;
      --panel: rgba(4, 18, 28, .90);
      --line: rgba(0, 229, 255, .30);
      --line-strong: rgba(0, 229, 255, .55);
      --text: #f5fbff;
      --muted: #9bb2bf;
      --cyan: #00e5ff;
      --green: #46ff9a;
      --red: #ff3860;
      --shadow: 0 22px 70px rgba(0, 0, 0, .55);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 8%, rgba(0, 229, 255, .13), transparent 34%),
        radial-gradient(circle at 90% 28%, rgba(70, 255, 154, .12), transparent 32%),
        linear-gradient(135deg, #01040a 0%, #061320 52%, #02060b 100%);
      color: var(--text);
      font-family: Segoe UI, Arial, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at 50% 20%, black, transparent 78%);
    }

    a,
    button { color: inherit; }

    button {
      border: 0;
      font-family: inherit;
      cursor: pointer;
    }

    .stream-shell {
      position: relative;
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      padding: 12px 0 calc(32px + var(--safe-bottom));
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 190px;
      border: 1px solid rgba(0,229,255,.24);
      border-radius: 26px 26px 0 0;
      background: #03101a;
      box-shadow: var(--shadow);
    }

    .hero-img {
      display: block;
      width: 100%;
      height: clamp(190px, 28vw, 360px);
      object-fit: contain;
      object-position: center;
      opacity: .72;
      background: #03101a;
    }

    .hero-copy {
      position: absolute;
      left: clamp(18px, 4vw, 52px);
      right: clamp(18px, 4vw, 52px);
      bottom: clamp(18px, 4vw, 44px);
      text-shadow: 0 8px 28px rgba(0,0,0,.72);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--green);
      font-size: clamp(13px, 1.5vw, 18px);
      font-weight: 900;
      text-transform: uppercase;
    }

    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 22px var(--green);
      animation: onAirPulse 1.35s ease-in-out infinite;
      flex: 0 0 auto;
    }

    @keyframes onAirPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.68); opacity: .56; }
    }

    h1 {
      margin: 10px 0 0;
      font-size: clamp(34px, 7vw, 82px);
      line-height: .92;
      letter-spacing: 0;
    }

    .stream-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(290px, .85fr);
      gap: 18px;
      border: 1px solid rgba(0,229,255,.24);
      border-top: 0;
      border-radius: 0 0 26px 26px;
      background: rgba(1, 8, 14, .54);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .video-card,
    .now-card,
    .debug-panel {
      border: 1px solid rgba(0,229,255,.24);
      border-radius: 18px;
      background:
        radial-gradient(circle at 20% 20%, rgba(0,229,255,.10), transparent 36%),
        linear-gradient(135deg, rgba(5, 18, 28, .95), rgba(3, 10, 18, .93));
      box-shadow: 0 18px 58px rgba(0,0,0,.42);
      backdrop-filter: blur(18px);
    }

    .video-card { padding: 14px; }

    .mse-stage {
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border: 1px solid rgba(0,229,255,.42);
      border-radius: 14px;
      background: #02070d;
      box-shadow: 0 0 44px rgba(0,229,255,.14);
    }

    video {
      display: block;
      width: 100%;
      height: 100%;
      background: #02070d;
      object-fit: contain;
    }

    .stream-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
    }

    .play-round {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), #46ff9a);
      color: #001018;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 0 30px rgba(0,229,255,.40);
    }

    .btn {
      display: inline-flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(0,229,255,.38);
      border-radius: 999px;
      background: rgba(0,229,255,.08);
      padding: 0 16px;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      text-transform: uppercase;
    }

    .stream-status {
      margin-left: auto;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .now-card {
      display: grid;
      gap: 16px;
      align-content: start;
      padding: 18px;
    }

    .cover-frame {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(0,229,255,.42);
      border-radius: 18px;
      background: #03101a;
      box-shadow: 0 0 34px rgba(0,229,255,.12);
    }

    .cover-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background: var(--cover-bg, none) center / cover no-repeat;
      filter: blur(18px) saturate(1.2);
      opacity: .45;
      transform: scale(1.12);
    }

    .cover-frame img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: rgba(2, 7, 13, .74);
    }

    .now-label {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .track-title {
      font-size: clamp(22px, 3vw, 38px);
      line-height: 1.02;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .track-artist,
    .show-title {
      color: var(--muted);
      font-size: clamp(15px, 1.7vw, 22px);
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .debug-panel {
      display: none;
      grid-column: 1 / -1;
      padding: 16px;
    }

    body.debug .debug-panel { display: block; }

    .row {
      margin-bottom: 10px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
    }

    input {
      width: min(720px, 100%);
      margin-top: 6px;
      border: 1px solid rgba(0,229,255,.38);
      border-radius: 10px;
      background: rgba(2, 7, 13, .88);
      color: var(--text);
      font-size: 14px;
      padding: 9px 10px;
    }

    pre {
      max-height: 360px;
      overflow: auto;
      margin: 12px 0 0;
      border-radius: 12px;
      background: #05090d;
      color: #d8edf7;
      padding: 12px;
      white-space: pre-wrap;
    }

    .debug-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .stream-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      font-size: 13px;
      padding: 16px 6px 0;
    }

    .hint {
      margin: 0;
      color: var(--muted);
      line-height: 1.4;
    }
    body.embed {
      margin: 0;
      background: #02070d;
      color: #f5fbff;
      overflow: hidden;
    }

    body.embed::before,
    body.embed .hero,
    body.embed .now-card,
    body.embed .stream-actions,
    body.embed .debug-panel,
    body.embed .stream-footer {
      display: none;
    }

    body.embed .stream-shell,
    body.embed .stream-layout,
    body.embed .video-card,
    body.embed .mse-stage {
      width: 100%;
      height: 100vh;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: #02070d;
      box-shadow: none;
    }

    body.embed .stream-layout {
      display: block;
    }

    body.embed video {
      width: 100%;
      height: 100vh;
      margin: 0;
      background: #02070d;
      object-fit: contain;
    }

    @media (max-width: 820px) {
      .hero {
        min-height: 0;
      }

      .hero-img {
        height: auto;
        max-height: 32vh;
      }

      .stream-layout {
        grid-template-columns: 1fr;
      }

      .stream-status {
        width: 100%;
        margin-left: 0;
      }

      .stream-footer {
        display: grid;
      }
    }
  </style>
</head>

<body>

  <div class="stream-shell">
    <section class="hero" aria-label="FactoryXradio banner">
      <img id="heroImage" class="hero-img" src="/hero.jpg" alt="FactoryXradio">
      <div class="hero-copy">
        <div class="eyebrow"><span class="status-dot"></span><span id="stationName">FactoryXradio</span></div>
      </div>
    </section>

    <main class="stream-layout">
      <section class="video-card" aria-label="Live video">
        <div class="mse-stage">
          <video id="video" controls muted autoplay playsinline></video>
        </div>
        <div class="stream-actions">
          <button class="play-round" id="btnStart" type="button" aria-label="Start live stream">▶</button>
          <button class="btn" id="btnStop" type="button">Stop</button>
          <a class="btn" href="/stream/rdj_stream.html?debug=1" target="_blank" rel="noopener">Debug</a>
          <div class="stream-status" id="streamStatusText">Ready</div>
        </div>
      </section>

      <aside class="now-card" aria-label="Now playing">
        <div class="cover-frame" id="coverFrame">
          <img id="coverImage" src="/cover_default.jpg" alt="Current artwork" onerror="this.onerror=null;this.src='/cover_default.jpg';">
        </div>
        <div class="now-label">Now Playing</div>
        <div class="track-title" id="trackTitle">Live Broadcast</div>
        <div class="track-artist" id="trackArtist">Only the best music 24/7</div>
        <div class="show-title" id="showTitle">FactoryXradio Live</div>
      </aside>

      <section class="debug-panel" aria-label="Stream diagnostics">
        <p class="hint">RDJ live fMP4/MSE diagnostics with manifest freshness watchdog and automatic session recovery.</p>
        <div class="row">
          <label>Base URL / folder</label><br>
          <input id="baseUrl" value="">
        </div>
        <div class="debug-actions">
          <button class="btn" id="btnClear" type="button">Clear Log</button>
        </div>
        <pre id="log"></pre>
      </section>
    </main>

    <footer class="stream-footer">
      <div>FactoryXradio</div>
      <div>RDJ Pro Video</div>
    </footer>
  </div>


<script>

(function () {

  'use strict';



  const video = document.getElementById('video');

  const logBox = document.getElementById('log');

  const btnStart = document.getElementById('btnStart');
  const btnStop = document.getElementById('btnStop');
  const btnClear = document.getElementById('btnClear');
  const baseUrlBox = document.getElementById('baseUrl');
  const streamStatusText = document.getElementById('streamStatusText');
  const coverFrame = document.getElementById('coverFrame');
  const coverImage = document.getElementById('coverImage');
  const heroImage = document.getElementById('heroImage');
  const params = new URLSearchParams(window.location.search);
  const embedMode = params.get('embed') === '1';
  const debugMode = params.get('debug') === '1';
  const autoStartParam = params.get('autostart') === '1';
  const requestedBaseUrl = params.get('base') || '';

  const bodyClasses = [];
  if (embedMode) bodyClasses.push('embed');
  if (debugMode) bodyClasses.push('debug');
  document.body.className = bodyClasses.join(' ');


  let mediaSource = null;

  let sourceBuffer = null;



  let stopped = true;

  let running = false;



  let manifest = null;

  let nextSeq = 0;

  let appendedSeq = Object.create(null);



  let requestSerial = 0;

  let lastManifestFirst = 0;
  let lastManifestLast = 0;
  let lastManifestPublishSeq = -1;
  let lastManifestSessionId = '';
  let activeSessionId = '';
  let sameManifestCount = 0;
  let lastProgressTime = 0;

  let lastPlayKickTime = 0;

  let manifestFailCount = 0;

  let appendBurstCount = 0;

  let liveEdgePauseStartedAt = 0;

  let fixedTempoLogged = false;

  let firstPlayReleased = false;
  let firstPlayBufferLogged = false;
  let sessionSwitching = false;
  let firstPlayMinBufferSec = 0;
  let userPausedPlayback = false;
  let internalPauseUntil = 0;

  function pauseVideoInternally() {
    internalPauseUntil = Date.now() + 1000;
    video.pause();
  }

  function isInternalPauseEvent() {
    return Date.now() <= internalPauseUntil;
  }


  const START_BEHIND_FRAGMENTS = 4;

  const POLL_IDLE_MS = 750;

  const POLL_AFTER_APPEND_MS = 80;

  const STALE_MANIFEST_LOG_EVERY = 8;

  const LIVE_LATENCY_TARGET_SEC = 8.0;

  const LIVE_LATENCY_MIN_SEC = 4.0;

  const LIVE_LATENCY_MAX_SEC = 18.0;

  const LIVE_FORWARD_JUMP_THRESHOLD_SEC = 24.0;



  // Milestone 8: the stream is stable, so favor smoothness over shaving

  // the final half-second of latency.  The old 1.5s edge guard was too

  // optimistic when one live.json poll failed and the browser was also

  // decoding/appending/pruning.

  const LIVE_EDGE_DANGER_SEC = 4.25;

  // Milestone 13:

  // Music must never wobble in tempo.  Do not use playbackRate as a buffer

  // governor.  Stay at 1.00x and use only tiny edge pauses as a last resort.

  const LIVE_EDGE_PAUSE_SEC = 0.90;

  const LIVE_RESTART_MIN_BUFFER_SEC = 2.60;

  const LIVE_EDGE_PAUSE_MAX_MS = 1200;

  const MIN_BUFFER_BEFORE_FIRST_PLAY_SEC = 8.00;
  const SESSION_SWITCH_BUFFER_SEC = 0.75;

  const APPEND_BURST_YIELD_EVERY = 3;

  const APPEND_BURST_YIELD_MS = 80;



  const BUFFER_KEEP_BEHIND_SEC = 90.0;
  const BUFFER_KEEP_AHEAD_SEC = 45.0;
  const AUTO_RESTART_KEY = 'rdj_mse_auto_restart';
  const AUTO_RESTART_BASE_URL_KEY = 'rdj_mse_auto_restart_base_url';
  const AUTO_RESTART_AUDIO_KEY = 'rdj_mse_audio_enabled';

  let preferredAudioEnabled = false;
  let suppressAudioPreferenceSave = false;

  function loadPreferredAudioEnabled() {
    try {
      preferredAudioEnabled = sessionStorage.getItem(AUTO_RESTART_AUDIO_KEY) === '1';
    } catch (_) {
      preferredAudioEnabled = false;
    }

    return preferredAudioEnabled;
  }

  function currentAudioEnabled() {
    try {
      return !video.muted && video.volume > 0;
    } catch (_) {
      return preferredAudioEnabled;
    }
  }

  function notifyAudioState() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'RDJ_STREAM_AUDIO_STATE', enabled: currentAudioEnabled() }, window.location.origin);
      }
    } catch (_) {
    }
  }

  function savePreferredAudioEnabled(value) {
    if (suppressAudioPreferenceSave) {
      return;
    }

    preferredAudioEnabled = !!value;

    try {
      sessionStorage.setItem(AUTO_RESTART_AUDIO_KEY, preferredAudioEnabled ? '1' : '0');
    } catch (_) {
    }
  }

  function applyPreferredAudio() {
    if (!preferredAudioEnabled) {
      return;
    }

    try {
      video.muted = false;
      video.defaultMuted = false;

      if (video.volume === 0) {
        video.volume = 1.0;
      }
    } catch (_) {
    }
  }

  function resetMediaElementPreservingAudio() {
    const restoreAudio = preferredAudioEnabled || currentAudioEnabled();

    suppressAudioPreferenceSave = true;

    try {
      pauseVideoInternally();
      video.playbackRate = 1.0;
      video.removeAttribute('src');
      video.load();
    } finally {
      suppressAudioPreferenceSave = false;
    }

    if (restoreAudio) {
      savePreferredAudioEnabled(true);
      applyPreferredAudio();
    }
  }

  function setStreamAudioEnabled(enabled, userGesture) {
    savePreferredAudioEnabled(enabled);

    try {
      if (enabled) {
        video.muted = false;
        video.defaultMuted = false;

        if (video.volume === 0) {
          video.volume = 1.0;
        }
      } else {
        video.muted = true;
        video.defaultMuted = true;
      }
    } catch (_) {
    }

    notifyAudioState();

    if (!enabled) {
      return;
    }

    if (!running) {
      start(!!userGesture);
    } else {
      try {
        const p = video.play();
        if (p && typeof p.catch === 'function') {
          p.catch(function (e) {
            log('video.play() after audio enable failed: ' + e.message);
          });
        }
      } catch (_) {
      }
    }
  }


  function resetLiveState() {

    manifest = null;

    nextSeq = 0;

    appendedSeq = Object.create(null);

    requestSerial = 0;

    lastManifestFirst = 0;
    lastManifestLast = 0;
    lastManifestPublishSeq = -1;
    lastManifestSessionId = '';
    activeSessionId = '';
    sameManifestCount = 0;
    lastProgressTime = 0;

    lastPlayKickTime = 0;

    manifestFailCount = 0;

    appendBurstCount = 0;

    liveEdgePauseStartedAt = 0;

    fixedTempoLogged = false;

    firstPlayReleased = false;

    firstPlayBufferLogged = false;
    firstPlayMinBufferSec = MIN_BUFFER_BEFORE_FIRST_PLAY_SEC;

    sourceBuffer = null;



    if (mediaSource) {

      try {

        if (mediaSource.readyState === 'open') {

          mediaSource.endOfStream();

        }

      } catch (_) {

      }

    }



    mediaSource = null;



    try {

      resetMediaElementPreservingAudio();

    } catch (_) {

    }

  }





  function defaultBaseUrl() {
    const url = new URL(window.location.href);
    url.hash = '';
    url.search = '';
    const path = url.pathname;
    url.pathname = path.substring(0, path.lastIndexOf('/') + 1);
    return url.href;
  }

  function normalizeBaseUrl(value) {
    const source = String(value || '').trim();
    const fallback = defaultBaseUrl();

    if (!source) {
      return fallback;
    }

    try {
      return new URL(source, fallback).href;
    } catch (_) {
      return fallback;
    }
  }

  baseUrlBox.value = normalizeBaseUrl(requestedBaseUrl);

  if (!requestedBaseUrl) {
    try {
      const savedBaseUrl = sessionStorage.getItem(AUTO_RESTART_BASE_URL_KEY);

      if (savedBaseUrl) {
        baseUrlBox.value = normalizeBaseUrl(savedBaseUrl);
      }
    } catch (_) {
    }
  }

  function firstText() {
    for (let i = 0; i < arguments.length; i++) {
      const value = arguments[i];
      if (value !== undefined && value !== null && String(value).trim() !== '') {
        return String(value).trim();
      }
    }
    return '';
  }

  function setText(id, value) {
    const el = document.getElementById(id);
    if (el && value !== undefined && value !== null && String(value).trim() !== '') {
      el.textContent = String(value).trim();
    }
  }

  function makeBrowserUrl(value, fallback) {
    const source = firstText(value, fallback);
    if (!source) {
      return '';
    }

    let url = String(source).trim();
    const isWebUrl = /^(https?:)?\/\//i.test(url);
    const queryIndex = url.indexOf('?');
    const query = queryIndex >= 0 ? url.substring(queryIndex) : '';
    let pathOnly = queryIndex >= 0 ? url.substring(0, queryIndex) : url;

    pathOnly = pathOnly.replace(/%5c/gi, '/').replace(/\\/g, '/');
    const fileName = pathOnly.substring(pathOnly.lastIndexOf('/') + 1).toLowerCase();
    const hasRelativePath = pathOnly.indexOf('/') >= 0;
    const looksLikeDiskPath = /^[a-z]:\//i.test(pathOnly) || pathOnly.indexOf('//') === 0;

    if (hasRelativePath && !looksLikeDiskPath && !isWebUrl &&
        url.charAt(0) !== '/' && url.charAt(0) !== '.') {
      return '/' + pathOnly + query;
    }

    if (fileName === 'cover.jpg' || fileName === 'cover.jpeg' ||
        fileName === 'cover.png' || fileName === 'cover.webp') {
      const ext = fileName.substring(fileName.lastIndexOf('.') + 1).replace('jpeg', 'jpg');
      return '/cover.' + ext + query;
    }

    if (fileName === 'cover_default.jpg' || fileName === 'cover_default.jpeg' ||
        fileName === 'cover_default.png' || fileName === 'cover_default.webp') {
      const ext = fileName.substring(fileName.lastIndexOf('.') + 1).replace('jpeg', 'jpg');
      return '/cover_default.' + ext + query;
    }

    if (fileName === 'hero.jpg' || fileName === 'hero.jpeg' ||
        fileName === 'hero.png' || fileName === 'hero.webp') {
      const ext = fileName.substring(fileName.lastIndexOf('.') + 1).replace('jpeg', 'jpg');
      return '/hero.' + ext + query;
    }

    if (isWebUrl || url.charAt(0) === '/' || url.charAt(0) === '.') {
      return url;
    }

    return '/' + url;
  }

  function setImageElement(el, value, fallback) {
    const next = makeBrowserUrl(value, fallback);
    const fallbackUrl = makeBrowserUrl(fallback, '');
    if (!el || !next) {
      return next;
    }

    el.onerror = function() {
      if (fallbackUrl && el.src !== fallbackUrl) {
        el.onerror = null;
        el.src = fallbackUrl + (fallbackUrl.indexOf('?') >= 0 ? '&' : '?') + 'ts=' + Date.now();
      }
    };

    try {
      const absoluteNext = new URL(next, window.location.origin + '/').href;
      if (el.src !== absoluteNext) {
        el.src = next;
      }
    } catch (_) {
      el.src = next;
    }

    return next;
  }

  function setCover(value) {
    const cover = setImageElement(coverImage, firstText(value, '/cover_default.jpg'), '/cover_default.jpg');
    if (coverFrame && cover) {
      coverFrame.style.setProperty('--cover-bg', "url('" + cover.replace(/'/g, "\\'") + "')");
    }
  }

  function setStreamStatus(text) {
    if (streamStatusText && text) {
      streamStatusText.textContent = text;
    }
  }

  function applyNowPlaying(data) {
    const live = data || {};
    setText('stationName', firstText(live.station, 'FactoryXradio'));
    setText('trackTitle', firstText(live.title, live.song, 'Live Broadcast'));
    setText('trackArtist', firstText(live.artist, live.djName, live.dj, 'Only the best music 24/7'));
    setText('showTitle', firstText(live.showName, live.show, live.showTitle, 'FactoryXradio Live'));
    setCover(firstText(live.coverUrl, live.artwork, live.albumArt, live.cover, live.image, '/cover_default.jpg'));
    setImageElement(heroImage, firstText(live.heroImage, '/hero.jpg'), '/hero.jpg');
  }

  async function loadNowPlaying() {
    try {
      const response = await fetch('/nowplaying.json?ts=' + Date.now(), { cache: 'no-store' });
      if (!response.ok) {
        return;
      }
      applyNowPlaying(await response.json());
    } catch (_) {
    }
  }

  function log(msg) {
    const time = new Date().toLocaleTimeString();
    logBox.textContent += '[' + time + '] ' + msg + '\n';
    logBox.scrollTop = logBox.scrollHeight;
    console.log(msg);
  }



  function urlOf(name) {

    baseUrlBox.value = normalizeBaseUrl(baseUrlBox.value);
    return new URL(name, baseUrlBox.value).href;

  }



  function cacheBusterUrl(name) {

    requestSerial++;

    return urlOf(name) + '?rdj_ts=' + Date.now() + '&rdj_n=' + requestSerial;

  }



  function sleep(ms) {

    return new Promise(resolve => setTimeout(resolve, ms));

  }



  function manifestPollMs() {

    if (manifest && Number.isFinite(Number(manifest.pollMs))) {

      return Math.max(250, Math.min(2000, Number(manifest.pollMs)));

    }



    return POLL_IDLE_MS;

  }



  function safeInt(value, fallback) {

    const n = Number(value);



    if (!Number.isFinite(n)) {

      return fallback;

    }



    return Math.trunc(n);

  }



  function normalizeManifest(m) {

    if (!m || typeof m !== 'object') {

      throw new Error('live.json is not an object');

    }



    const first = safeInt(m.first, 0);

    const last = safeInt(m.last, 0);



    if (first < 1 || last < 1 || last < first) {

      throw new Error('bad range first=' + m.first + ' last=' + m.last);

    }



    m.first = first;

    m.last = last;

    m.init = m.init || 'init.mp4';

    m.prefix = m.prefix || 'patched_frag_';

    m.ext = m.ext || '.m4s';

    m.digits = safeInt(m.digits, 6);

    m.codec = m.codec || 'video/mp4; codecs="avc1.42C01F, mp4a.40.2"';

    m.pollMs = safeInt(m.pollMs, POLL_IDLE_MS);

    m.fragmentTargetMs = safeInt(m.fragmentTargetMs, 2000);

    m.groupSourceFragments = safeInt(m.groupSourceFragments, 7);

    m.publishSeq = safeInt(m.publishSeq, -1);

    m.sessionId = String(m.sessionId || '');

    m.sourceSeq = safeInt(m.sourceSeq, 0);

    m.pendingGroupParts = safeInt(m.pendingGroupParts, 0);



    return m;

  }



  async function fetchJsonFresh(name) {

    const response = await fetch(cacheBusterUrl(name), {

      cache: 'no-store',

      mode: 'same-origin',

      headers: {

        'Cache-Control': 'no-cache, no-store, max-age=0',

        'Pragma': 'no-cache',

        'Expires': '0'

      }

    });



    if (!response.ok) {

      throw new Error(name + ' HTTP ' + response.status + ' ' + response.statusText);

    }



    const text = await response.text();



    if (text.trim() === '') {

      throw new Error(name + ' is empty');

    }



    try {

      return JSON.parse(text);

    } catch (e) {

      throw new Error(name + ' parse error: ' + e.message + ', text=' + text.substring(0, 80));

    }

  }



  async function fetchBytesFresh(name) {

    const response = await fetch(cacheBusterUrl(name), {

      cache: 'no-store',

      mode: 'same-origin',

      headers: {

        'Cache-Control': 'no-cache, no-store, max-age=0',

        'Pragma': 'no-cache',

        'Expires': '0'

      }

    });



    if (!response.ok) {

      throw new Error(name + ' HTTP ' + response.status + ' ' + response.statusText);

    }



    return await response.arrayBuffer();

  }



  function fragName(seq, m) {

    const s = String(seq).padStart(m.digits || 6, '0');

    return m.prefix + s + m.ext;

  }



  function chooseStartSeq(m) {

    return Math.max(m.first, m.last - START_BEHIND_FRAGMENTS + 1);

  }



  function waitForSourceOpen(ms) {

    return new Promise((resolve, reject) => {

      let done = false;



      function ok() {

        if (done) return;

        done = true;

        cleanup();

        resolve();

      }



      function fail() {

        if (done) return;

        done = true;

        cleanup();

        reject(new Error('MediaSource sourceopen timeout'));

      }



      function cleanup() {

        clearTimeout(timer);

        mediaSource.removeEventListener('sourceopen', ok);

      }



      const timer = setTimeout(fail, ms);

      mediaSource.addEventListener('sourceopen', ok, { once: true });

    });

  }



  function waitForUpdateEnd() {

    return new Promise((resolve, reject) => {

      if (!sourceBuffer || !sourceBuffer.updating) {

        resolve();

        return;

      }



      function ok() {

        cleanup();

        resolve();

      }



      function err() {

        cleanup();

        reject(new Error('SourceBuffer error'));

      }



      function cleanup() {

        sourceBuffer.removeEventListener('updateend', ok);

        sourceBuffer.removeEventListener('error', err);

      }



      sourceBuffer.addEventListener('updateend', ok);

      sourceBuffer.addEventListener('error', err);

    });

  }



  async function appendBytes(bytes, label) {

    await waitForUpdateEnd();



    return new Promise((resolve, reject) => {

      function ok() {

        cleanup();

        resolve();

      }



      function err() {

        cleanup();

        reject(new Error('SourceBuffer error while appending ' + label));

      }



      function cleanup() {

        sourceBuffer.removeEventListener('updateend', ok);

        sourceBuffer.removeEventListener('error', err);

      }



      sourceBuffer.addEventListener('updateend', ok);

      sourceBuffer.addEventListener('error', err);



      try {

        sourceBuffer.appendBuffer(bytes);

      } catch (e) {

        cleanup();

        reject(e);

      }

    });

  }



  function bufferedRanges() {

    const ranges = [];



    for (let i = 0; i < video.buffered.length; i++) {

      ranges.push(video.buffered.start(i).toFixed(3) + '-' + video.buffered.end(i).toFixed(3));

    }



    return ranges.length ? ranges.join(', ') : '(none)';

  }



  function lastBufferedEnd() {

    if (video.buffered.length <= 0) {

      return 0;

    }



    return video.buffered.end(video.buffered.length - 1);

  }



  function activeBufferedRange() {

    if (video.buffered.length <= 0) {

      return null;

    }



    const t = video.currentTime;



    for (let i = 0; i < video.buffered.length; i++) {

      const start = video.buffered.start(i);

      const end = video.buffered.end(i);



      if ((t >= start) && (t <= end)) {

        return { start: start, end: end };

      }

    }



    return {

      start: video.buffered.start(video.buffered.length - 1),

      end: video.buffered.end(video.buffered.length - 1)

    };

  }



  function enforceFixedTempo() {

    if (Math.abs(video.playbackRate - 1.0) < 0.001) {

      return;

    }



    try {

      video.playbackRate = 1.0;



      if (!fixedTempoLogged) {

        fixedTempoLogged = true;

        log('Fixed tempo: forced playbackRate back to 1.00');

      }

    } catch (_) {

    }

  }





  function tuneLivePlayback() {

    if (userPausedPlayback) {

      return;

    }

    if (video.buffered.length <= 0) {

      return;

    }



    const now = Date.now();

    if (now - lastPlayKickTime < 1000) {

      return;

    }



    lastPlayKickTime = now;



    const range = activeBufferedRange();

    if (!range) {

      return;

    }



    const liveEdge = range.end;

    const rangeDuration = range.end - range.start;

    let behind = liveEdge - video.currentTime;



    // Milestone 13:

    // RDJ is music first: never change playbackRate to save cushion.  When the

    // public edge gets too close, use only short pauses or forward recovery.

    if (video.currentTime < range.start || video.currentTime > liveEdge) {

      if (rangeDuration < firstPlayMinBufferSec) {

        try {

          video.currentTime = range.start + 0.03;

        } catch (_) {

        }

        return;

      }



      const target = Math.max(range.start + 0.25, liveEdge - LIVE_LATENCY_TARGET_SEC);

      try {

        video.currentTime = Math.min(target, liveEdge - 0.25);

        behind = liveEdge - video.currentTime;

        log('Live recover to buffer: current=' + video.currentTime.toFixed(3) +

            ', edge=' + liveEdge.toFixed(3) +

            ', behind=' + behind.toFixed(3));

      } catch (_) {

      }

    } else if (behind > LIVE_FORWARD_JUMP_THRESHOLD_SEC) {

      const target = Math.max(video.currentTime, liveEdge - LIVE_LATENCY_TARGET_SEC);

      if (target > video.currentTime + 0.25) {

        try {

          video.currentTime = target;

          behind = liveEdge - video.currentTime;

          log('Live forward adjust: current=' + video.currentTime.toFixed(3) +

              ', edge=' + liveEdge.toFixed(3) +

              ', behind=' + behind.toFixed(3));

        } catch (_) {

        }

      }

    }



    const refreshed = activeBufferedRange();

    if (!refreshed) {

      return;

    }



    const refreshedBehind = refreshed.end - video.currentTime;



    // Milestone 10:

    // Do not let muted autoplay start consuming tiny early fragments.  Hold

    // the browser paused until the first useful cushion is available.  This

    // removes the startup emergency pause seen around fragment 6 in the test

    // run, where playback had already started with only ~1.8s buffered.

    if (!firstPlayReleased) {

      if (refreshedBehind < firstPlayMinBufferSec) {

        if (!video.paused) {

          try {

            pauseVideoInternally();

          } catch (_) {

          }

        }



        if (!firstPlayBufferLogged) {

          firstPlayBufferLogged = true;

          log('Startup buffer: waiting for ' +

              firstPlayMinBufferSec.toFixed(2) +

              's, behind=' + refreshedBehind.toFixed(3));

        }



        return;

      }



      firstPlayReleased = true;

      log('Startup buffer ready: behind=' + refreshedBehind.toFixed(3));

    }



    enforceFixedTempo();



    if (refreshedBehind < LIVE_EDGE_PAUSE_SEC) {

      if (!video.paused) {

        try {

          pauseVideoInternally();

          liveEdgePauseStartedAt = Date.now();

          log('Live edge guard: short fixed-tempo pause, edge=' + refreshed.end.toFixed(3) +

              ', behind=' + refreshedBehind.toFixed(3));

        } catch (_) {

        }

      }



      return;

    }



    if (video.paused && liveEdgePauseStartedAt > 0) {

      const pauseMs = Date.now() - liveEdgePauseStartedAt;



      if (refreshedBehind < LIVE_RESTART_MIN_BUFFER_SEC &&

          pauseMs < LIVE_EDGE_PAUSE_MAX_MS) {

        return;

      }



      log('Live edge guard: resume fixed-tempo, behind=' +

          refreshedBehind.toFixed(3) + ', pauseMs=' + pauseMs);

      liveEdgePauseStartedAt = 0;

    }



    if (video.paused && refreshedBehind < LIVE_RESTART_MIN_BUFFER_SEC) {

      return;

    }



    const p = video.play();

    if (p && typeof p.catch === 'function') {

      p.catch(function (e) {
        log('video.play() not started yet: ' + e.message);

        if (preferredAudioEnabled) {
          setStreamStatus('Tap play to enable audio');
          log('Audio restore was requested, but the browser blocked unmuted autoplay.');
        }
      });

    }

  }



  async function pruneOldBuffer() {

    if (!sourceBuffer || sourceBuffer.updating || video.buffered.length <= 0) {

      return;

    }



    const t = video.currentTime;

    const removeEnd = t - BUFFER_KEEP_BEHIND_SEC;



    if (removeEnd <= 0) {

      return;

    }



    for (let i = 0; i < video.buffered.length; i++) {

      const start = video.buffered.start(i);

      const end = video.buffered.end(i);



      if (end < removeEnd) {

        await waitForUpdateEnd();

        try {

          sourceBuffer.remove(start, end);

          await waitForUpdateEnd();

          log('Pruned old buffer: ' + start.toFixed(3) + '-' + end.toFixed(3));

        } catch (_) {

        }

        return;

      }



      if (start < removeEnd - 5.0) {

        await waitForUpdateEnd();

        try {

          sourceBuffer.remove(start, removeEnd);

          await waitForUpdateEnd();

          log('Pruned old buffer: ' + start.toFixed(3) + '-' + removeEnd.toFixed(3));

        } catch (_) {

        }

        return;

      }

    }

  }



  async function readManifest() {

    const m = normalizeManifest(await fetchJsonFresh('live.json'));



    manifestFailCount = 0;



    if (m.first !== lastManifestFirst ||

        m.last !== lastManifestLast ||

        m.publishSeq !== lastManifestPublishSeq ||

        m.sessionId !== lastManifestSessionId) {

      lastManifestFirst = m.first;

      lastManifestLast = m.last;

      lastManifestPublishSeq = m.publishSeq;

      lastManifestSessionId = m.sessionId;

      sameManifestCount = 0;

      log('Manifest update: first=' + m.first +

          ' last=' + m.last +

          ' publishSeq=' + m.publishSeq +

          ' sourceSeq=' + m.sourceSeq +

          ' pending=' + m.pendingGroupParts + '/' + m.groupSourceFragments);

    } else {

      sameManifestCount++;



      if ((sameManifestCount % STALE_MANIFEST_LOG_EVERY) === 0) {

        log('Manifest unchanged: first=' + m.first +

            ' last=' + m.last +

            ' publishSeq=' + m.publishSeq +

            ' for ' + sameManifestCount + ' polls');

      }



      if (sameManifestCount === 40) {

        log('Manifest stale warning: public live.json is not advancing. ' +

            'If RDJ is still producing samples, check public segment publish/mirror, not the browser cache.');

      }

    }



    manifest = m;

    return m;

  }



  async function waitForInitialManifest() {

    while (!stopped) {

      try {

        return await readManifest();

      } catch (e) {

        log('Waiting for live.json: ' + e.message);

        await sleep(500);

      }

    }



    throw new Error('stopped while waiting for live.json');

  }



  async function setupMse(m) {
    mediaSource = new MediaSource();
    video.src = URL.createObjectURL(mediaSource);
    applyPreferredAudio();


    await waitForSourceOpen(5000);



    log('MediaSource open.');



    if (!MediaSource.isTypeSupported(m.codec)) {

      throw new Error('MIME not supported: ' + m.codec);

    }



    sourceBuffer = mediaSource.addSourceBuffer(m.codec);

    sourceBuffer.mode = 'segments';



    const initBytes = await fetchBytesFresh(m.init);

    await appendBytes(initBytes, m.init);



    try {

      pauseVideoInternally();

      video.currentTime = 0;

    } catch (_) {

    }


    log('Appended ' + m.init + ', buffered=' + bufferedRanges());
  }

  function detachMediaSource() {
    try {
      if (mediaSource && mediaSource.readyState === 'open') {
        mediaSource.endOfStream();
      }
    } catch (_) {
    }

    try {
      resetMediaElementPreservingAudio();
    } catch (_) {
    }

    mediaSource = null;
    sourceBuffer = null;
  }

  async function restartMseForSessionChange(m) {
    const oldSessionId = activeSessionId || '(none)';

    log('Session change: old=' + oldSessionId +
        ' new=' + m.sessionId +
        ', resetting MediaSource');

    if (sessionSwitching) {
      return;
    }

    sessionSwitching = true;
    stopped = true;

    try {
      savePreferredAudioEnabled(preferredAudioEnabled || (!video.muted && video.volume > 0));
      detachMediaSource();

      nextSeq = chooseStartSeq(m);
      appendedSeq = Object.create(null);
      appendBurstCount = 0;
      liveEdgePauseStartedAt = 0;
      fixedTempoLogged = false;
      firstPlayReleased = false;
      firstPlayBufferLogged = false;
      firstPlayMinBufferSec = SESSION_SWITCH_BUFFER_SEC;
      manifestFailCount = 0;
      sameManifestCount = 0;
      manifest = m;

      stopped = false;
      running = true;
      setStreamStatus('Reconnecting');

      await setupMse(m);
      activeSessionId = m.sessionId;
      lastProgressTime = Date.now();

      log('Session restart at fragment ' + nextSeq + ', window=' + m.first + '-' + m.last);
      setStreamStatus('Streaming');
      pump();
    } catch (_) {
      log('Session reset failed, falling back to page reload');
      try {
        sessionStorage.setItem(AUTO_RESTART_KEY, '1');
        sessionStorage.setItem(AUTO_RESTART_BASE_URL_KEY, baseUrlBox.value);
        sessionStorage.setItem(AUTO_RESTART_AUDIO_KEY, preferredAudioEnabled ? '1' : '0');
      } catch (_) {
      }
      window.setTimeout(function () {
        window.location.reload();
      }, 100);
    } finally {
      sessionSwitching = false;
    }
  }

  async function pump() {
    while (!stopped) {

      let m;



      try {

        m = await readManifest();

      } catch (e) {

        manifestFailCount++;



        if (manifestFailCount <= 3 || (manifestFailCount % 10) === 0) {

          log('Manifest fetch failed, keeping old state: ' + e.message);
        }


        // Soft backoff only. Do not rewind, reset nextSeq, or run live recovery

        // because of a manifest miss. The previous manifest is still valid map.

        await sleep(Math.min(2000, manifestPollMs() + (manifestFailCount * 250)));

        continue;
      }

      if (activeSessionId === '') {
        activeSessionId = m.sessionId;
      } else if (m.sessionId !== '' && m.sessionId !== activeSessionId) {
        await restartMseForSessionChange(m);
        return;
      }

      if (nextSeq <= 0) {
        nextSeq = chooseStartSeq(m);

        log('Starting at fragment ' + nextSeq + ', window=' + m.first + '-' + m.last);

      }



      // Safety: if an old browser state somehow survived, do not wait forever.

      if (nextSeq > m.last + START_BEHIND_FRAGMENTS) {

        const old = nextSeq;

        nextSeq = chooseStartSeq(m);

        appendedSeq = Object.create(null);

        log('Recovered stale nextSeq: old next=' + old +

            ', new next=' + nextSeq +

            ', window=' + m.first + '-' + m.last);

      }



      if (nextSeq < m.first) {

        const old = nextSeq;

        nextSeq = chooseStartSeq(m);

        appendedSeq = Object.create(null);

        log('Jump to live window: old next=' + old +

            ', new next=' + nextSeq +

            ', window=' + m.first + '-' + m.last);

      }



      if (nextSeq > m.last) {

        const silentFor = Date.now() - lastProgressTime;



        if (lastProgressTime > 0 && silentFor > 3000) {

          log('Waiting for newer manifest. next=' + nextSeq +

              ' current window=' + m.first + '-' + m.last);

          lastProgressTime = Date.now();

        }



        await sleep(manifestPollMs());

        continue;

      }



      const seq = nextSeq;



      if (appendedSeq[seq]) {

        nextSeq++;

        continue;

      }



      const name = fragName(seq, m);



      try {

        const bytes = await fetchBytesFresh(name);



        await appendBytes(bytes, name);



        appendedSeq[seq] = true;

        nextSeq = seq + 1;

        lastProgressTime = Date.now();



        log('Appended ' + name +

            ', bytes=' + bytes.byteLength +

            ', buffered=' + bufferedRanges());



        tuneLivePlayback();

        await pruneOldBuffer();



        appendBurstCount++;

        if ((appendBurstCount % APPEND_BURST_YIELD_EVERY) === 0) {

          await sleep(APPEND_BURST_YIELD_MS);

        } else {

          await sleep(POLL_AFTER_APPEND_MS);

        }

      } catch (e) {

        log('Fragment not ready, retry same sequence: ' + name + ': ' + e.message);

        await sleep(manifestPollMs());

      }

    }

  }



  async function start(userGesture) {

    if (running) {
      if (userPausedPlayback) {
        userPausedPlayback = false;

        try {
          const p = video.play();
          if (p && typeof p.catch === 'function') {
            p.catch(function (e) {
              log('video.play() after resume failed: ' + e.message);
            });
          }
        } catch (_) {
        }
      }

      return;

    }

    userPausedPlayback = false;

    if (userGesture) {
      savePreferredAudioEnabled(true);
      applyPreferredAudio();
    }



    resetLiveState();
    applyPreferredAudio();



    stopped = false;
    running = true;
    btnStart.disabled = true;
    btnStart.textContent = '...';
    setStreamStatus('Connecting');

    if (window.location.protocol === 'file:') {
      log('ERROR: use HTTP/HTTPS, not file://');
      setStreamStatus('Open through HTTP/HTTPS');
      stop();
      return;
    }


    try {

      log('Base URL: ' + baseUrlBox.value);



      const m = await waitForInitialManifest();



      log('Manifest OK: first=' + m.first +

          ', last=' + m.last +

          ', init=' + m.init);

      log('MIME: ' + m.codec);

      log('Manifest hints: pollMs=' + m.pollMs +

          ', fragmentTargetMs=' + m.fragmentTargetMs +

          ', groupSourceFragments=' + m.groupSourceFragments);



      await setupMse(m);

      activeSessionId = m.sessionId;

      lastProgressTime = Date.now();

      pump();
      setStreamStatus('Streaming');
      btnStart.textContent = '▶';
    } catch (e) {
      log('ERROR: ' + e.message);
      setStreamStatus('Stream unavailable');
      stop();
    }
  }


  function stop() {

    userPausedPlayback = false;
    stopped = true;
    running = false;
    btnStart.disabled = false;
    btnStart.textContent = '▶';
    setStreamStatus('Stopped');
    try { video.playbackRate = 1.0; } catch (_) {}
    log('Stopped.');
  }


  btnStart.addEventListener('click', function () {
    start(true);
  });

  btnStop.addEventListener('click', stop);

  window.rdjStreamEnableAudio = function () {
    setStreamAudioEnabled(true, true);
  };

  window.rdjStreamDisableAudio = function () {
    setStreamAudioEnabled(false, false);
  };

  window.rdjStreamSetAudioEnabled = function (enabled) {
    setStreamAudioEnabled(!!enabled, true);
  };

  window.addEventListener('message', function (event) {
    if (event.origin !== window.location.origin || !event.data) {
      return;
    }

    if (event.data.type === 'RDJ_STREAM_SET_AUDIO_ENABLED') {
      window.rdjStreamSetAudioEnabled(!!event.data.enabled);
    } else if (event.data.type === 'RDJ_STREAM_ENABLE_AUDIO') {
      window.rdjStreamEnableAudio();
    } else if (event.data.type === 'RDJ_STREAM_DISABLE_AUDIO') {
      window.rdjStreamDisableAudio();
    }
  });


  btnClear.addEventListener('click', function () {

    logBox.textContent = '';

  });



  video.addEventListener('error', function () {

    const err = video.error;



    if (err) {

      log('Video error code=' + err.code + ', message=' + (err.message || '(none)'));

    } else {

      log('Video error event.');

    }

  });

  video.addEventListener('pause', function () {
    if (!running || isInternalPauseEvent()) {
      return;
    }

    userPausedPlayback = true;
    liveEdgePauseStartedAt = 0;
    btnStart.disabled = false;
    setStreamStatus('Paused');
    log('Playback paused from browser/media controls.');
  });

  video.addEventListener('play', function () {
    if (userPausedPlayback) {
      log('Playback resumed from browser/media controls.');
    }

    userPausedPlayback = false;

    if (running) {
      setStreamStatus('Streaming');
    }
  });

  video.addEventListener('volumechange', function () {
    savePreferredAudioEnabled(!video.muted && video.volume > 0);
    notifyAudioState();
  });



  let autoRestart = false;

  try {
    loadPreferredAudioEnabled();
    autoRestart = sessionStorage.getItem(AUTO_RESTART_KEY) === '1';
    sessionStorage.removeItem(AUTO_RESTART_KEY);
  } catch (_) {
    autoRestart = false;
  }

  applyPreferredAudio();
  notifyAudioState();

  setCover('/cover_default.jpg');
  loadNowPlaying();
  window.setInterval(loadNowPlaying, 10000);

  if (autoRestart) {
    log('Ready. Auto-restarting live MSE after stream session change.');
    setStreamStatus('Reconnecting');
    window.setTimeout(start, 250);
  } else if (autoStartParam) {
    log('Ready. Auto-starting live MSE.');
    setStreamStatus('Connecting');
    window.setTimeout(start, 250);
  } else {
    log('Ready. Open through HTTP/HTTPS, then click Start live MSE.');
    setStreamStatus('Ready');
  }
})();
</script>
