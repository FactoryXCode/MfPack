<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title></title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#02070d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FactoryXradio">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <style>
    :root {
      --bg: #02070d;
      --panel: rgba(4, 18, 28, 0.88);
      --line: rgba(0, 229, 255, 0.30);
      --line-strong: rgba(0, 229, 255, 0.55);
      --text: #f5fbff;
      --muted: #9bb2bf;
      --cyan: #00e5ff;
      --green: #46ff9a;
      --red: #ff3860;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.55);
      --radius: 22px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 8%, rgba(0, 229, 255, 0.13), transparent 34%),
        radial-gradient(circle at 90% 28%, rgba(70, 255, 154, 0.12), transparent 32%),
        linear-gradient(135deg, #01040a 0%, #061320 52%, #02060b 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at 50% 20%, black, transparent 78%);
    }

    a, button { color: inherit; }
    button { font-family: inherit; }

    .page {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      padding: 12px 0 calc(32px + var(--safe-bottom));
    }

    .shell {
      overflow: hidden;
      border: 1px solid rgba(0,229,255,.24);
      border-radius: 26px;
      background: rgba(1, 8, 14, .54);
      box-shadow: var(--shadow);
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: #03101a;
      border-bottom: 1px solid rgba(0,229,255,.20);
      aspect-ratio: 1536 / 509;
    }

    .hero-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      background: #03101a;
    }

    .card {
      margin: 18px;
      border: 1px solid rgba(0,229,255,.24);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 20% 20%, rgba(0,229,255,.10), transparent 36%),
        linear-gradient(135deg, rgba(5, 18, 28, .95), rgba(3, 10, 18, .93));
      box-shadow: 0 18px 58px rgba(0,0,0,.42);
      backdrop-filter: blur(18px);
      padding: 24px;
    }

    .onair-card {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 28px;
      align-items: center;
      padding: 32px 42px;
    }

    .onair-left {
      display: grid;
      gap: 14px;
      border-right: 1px solid rgba(155,178,191,.32);
      padding-right: 34px;
    }

    .show-wrap {
      display: grid;
      gap: 8px;
      min-width: 0;
    }

    .onair-label,
    .now-label,
    .live-label {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--green);
      font-size: clamp(16px, 1.7vw, 22px);
      font-weight: 900;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .now-label,
    .live-label { color: var(--cyan); }

    .onair-dot,
    .status-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 22px var(--green);
      animation: onAirPulse 1.35s ease-in-out infinite;
      flex: 0 0 auto;
    }

    @keyframes onAirPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.68); opacity: 0.56; }
    }

    .dj-name {
      font-size: clamp(16px, 2vw, 28px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1px;
      overflow-wrap: anywhere;
    }

    .show-title {
      font-size: clamp(16px, 2vw, 28px);
      font-weight: 700;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .now-card {
      display: grid;
      grid-template-columns: minmax(240px, 430px) 1fr;
      gap: 18px;
      align-items: center;
      padding: 30px 34px;
    }

    .cover-frame {
      position: relative;
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(0,229,255,.42);
      background: #04101a;
      box-shadow: 0 0 44px rgba(0,229,255,.14);
      contain: paint;
    }

    .cover-frame::before {
      content: "";
      position: absolute;
      inset: -24px;
      background: var(--cover-bg, none) center / cover no-repeat;
      filter: blur(22px);
      opacity: .32;
      transform: scale(1.08);
    }

    .cover-frame img {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
    }

    .track-panel { display: grid; gap: 18px; min-width: 0; }
    .field-label {
      color: var(--cyan);
      font-size: clamp(8px, .9vw, 11px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 8px;
    }

    .track-artist,
    .track-title {
      color: var(--text);
      font-size: clamp(17px, 2vw, 27px);
      font-weight: 900;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .track-title { font-size: clamp(18px, 2.3vw, 31px); }

    .info-row {
      display: grid;
      grid-template-columns: minmax(120px, auto) 1px minmax(140px, auto);
      gap: 12px;
      align-items: center;
      margin-top: 8px;
    }

    .divider {
      width: 1px;
      height: 84px;
      background: rgba(155,178,191,.32);
    }

    .listener-number {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(9px, 1.5vw, 16px);
      font-weight: 900;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      width: max-content;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid rgba(0,229,255,.28);
      background: rgba(0,229,255,.08);
      color: var(--green);
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: inset 0 0 18px rgba(0,229,255,.07);
    }

    .video-frame {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      border: 1px solid rgba(0,229,255,.42);
      background: #02070d;
      box-shadow: 0 0 44px rgba(0,229,255,.14);
    }

    .video-frame video,
    .video-frame iframe {
      display: block;
      width: 100%;
      height: 100%;
      background: #02070d;
      object-fit: contain;
    }

    .video-frame iframe {
      border: 0;
    }

    .video-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
    }

    .video-status {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .3px;
      text-transform: uppercase;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 18px;
      border-radius: 14px;
      border: 1px solid rgba(0,229,255,.45);
      background: rgba(0,229,255,.07);
      color: var(--text);
      font-size: 12px;
      font-weight: 900;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn.primary {
      color: #031016;
      border: 0;
      background: linear-gradient(135deg, var(--cyan), var(--green));
      box-shadow: 0 0 24px rgba(0,229,255,.22);
    }

    .debug-line {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      opacity: .85;
    }

    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      padding: 22px 26px 24px;
      color: var(--muted);
      border-top: 1px solid rgba(0,229,255,.16);
      font-size: 12px;
    }

    footer b { color: var(--cyan); }
    .connection { color: var(--green); font-weight: 800; }
    .copyright { text-align: right; }

    .text-changing { animation: textChange .42s ease both; }
    @keyframes textChange {
      0% { opacity: .18; transform: translateY(10px); filter: blur(3px); }
      60% { opacity: 1; transform: translateY(0); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @media (max-width: 900px) {
      .onair-card, .now-card { grid-template-columns: 1fr; padding: 24px; }
      .onair-left { border-right: 0; border-bottom: 1px solid rgba(155,178,191,.28); padding-right: 0; padding-bottom: 22px; }
      .card { margin: 12px; }
      footer { grid-template-columns: 1fr; text-align: center; }
      .copyright { text-align: center; }
    }

    @media (max-width: 620px) {
      .page { width: calc(100% - 16px); padding-top: 8px; }
      .shell { border-radius: 20px; }
      .hero {
        aspect-ratio: auto;
      }
      .hero-img {
        height: auto;
        max-height: 30vh;
      }
      .info-row { grid-template-columns: auto auto; gap: 8px; }
      .divider { display: none; }
      .video-toolbar { align-items: stretch; }
      .debug-line { width: 100%; margin-left: 0; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="shell">
      <section class="hero" aria-label="FactoryXradio banner">
        <img id="heroImage" class="hero-img" src="hero.jpg" alt="FactoryXradio">
      </section>

      <section class="card onair-card" aria-label="Current live show">
        <div class="onair-left">
          <div class="onair-label"><span class="onair-dot"></span>On Air Now With:</div>
          <div class="dj-name" id="playerDjName">DJ Charlie</div>
        </div>
        <div class="show-wrap">
          <div class="show-title" id="playerShowName">FactoryXradio Live</div>
        </div>
      </section>

      <main>
        <section class="card now-card" aria-label="Now playing">
          <div>
            <div class="cover-frame" id="coverFrame">
              <img id="coverImage" src="cover_default.jpg" alt="Current artwork" onerror="this.onerror=null;this.src='/cover_default.jpg';">
            </div>
            <div class="now-label" style="margin-top:12px;">▥ Now Playing</div>
          </div>

          <div class="track-panel">
            <div>
              <div class="track-artist" id="trackArtist">Only the best music 24/7</div>
            </div>
            <div>
              <div class="track-title" id="trackTitle">Live Broadcast</div>
            </div>

            <div class="info-row">
              <div>
                <div class="field-label">Listeners</div>
                <div class="listener-number"><span id="listeners">67</span><span class="live-pill">Tuned in</span></div>
              </div>
              <div class="divider" aria-hidden="true"></div>
              <div>
                <div class="live-label">⌁ RDJ Pro Stream</div>
                <div class="live-pill"><span class="status-dot"></span><span id="streamStatusText">Ready</span></div>
              </div>
            </div>
          </div>
        </section>

        <section class="card" aria-label="FactoryXradio live video">
          <div class="live-label">▣ Live Video</div>
          <div class="video-frame">
            <iframe
              id="rdjStreamFrame"
              title="RDJ Pro live stream"
              src="/stream/rdj_stream.html?embed=1&amp;autostart=1&amp;base=https%3A%2F%2Ffactoryxradio.asuscomm.com%2Fstream%2F"
              allow="autoplay; fullscreen"
              loading="eager"></iframe>
          </div>
          <div class="video-toolbar">
            <button class="btn primary" id="enableVideoAudioButton" type="button">Enable Audio</button>
            <div class="video-status" id="videoStatusText">RDJ Pro MSE stream</div>
          </div>
        </section>
      </main>

      <footer>
        <div class="connection">⌁ Connection: Excellent</div>
        <div><b>FactoryXradio</b> — RDJ Pro Video</div>
        <div class="copyright">© <span id="year"></span> FactoryXradio</div>
      </footer>
    </div>
  </div>

  <script>
    const rdjStreamFrame = document.getElementById("rdjStreamFrame");
    const enableVideoAudioButton = document.getElementById("enableVideoAudioButton");

    function enableEmbeddedVideoAudio() {
      let handled = false;

      try {
        const child = rdjStreamFrame && rdjStreamFrame.contentWindow;
        if (child && typeof child.rdjStreamEnableAudio === "function") {
          child.rdjStreamEnableAudio();
          handled = true;
        }
      } catch (e) {
      }

      try {
        if (rdjStreamFrame && rdjStreamFrame.contentWindow) {
          rdjStreamFrame.contentWindow.postMessage({ type: "RDJ_STREAM_ENABLE_AUDIO" }, window.location.origin);
          handled = true;
        }
      } catch (e) {
      }

      setText("streamStatusText", handled ? "Streaming with audio" : "Audio enable unavailable");
      setText("videoStatusText", handled ? "Audio enabled" : "Audio enable unavailable");
    }

    if (enableVideoAudioButton) {
      enableVideoAudioButton.addEventListener("click", enableEmbeddedVideoAudio);
    }
    const DEFAULT_INFO = {
      station: "FactoryXradio",
      dj: "DJ Playlist",
      djName: "DJ Playlist",
      showName: "FactoryXradio Live",
      showTitle: "FactoryXradio Live",
      show: "FactoryXradio Live",
      title: "Live Broadcast",
      artist: "Only the best music 24/7",
      listeners: "67",
      displayListeners: "67",
      heroImage: "hero.jpg",
      coverUrl: "cover_default.jpg"
    };

    if (document.getElementById("rdjVideo")) {
    const VIDEO_URL = "/video/live.mp4";
    const VIDEO_POLL_MS = 850;
    const VIDEO_FETCH_CHUNK_SIZE = 1024 * 512;

    const MIME_CANDIDATES = [
      'video/mp4; codecs="avc1.42E01F, mp4a.40.2"',
      'video/mp4; codecs="avc1.4D401F, mp4a.40.2"',
      'video/mp4; codecs="avc1.64001F, mp4a.40.2"',
      'video/mp4; codecs="avc1.42C01F, mp4a.40.2"',
      'video/mp4'
    ];

    const video = document.getElementById("rdjVideo");
    const startVideoButton = document.getElementById("startVideoButton");
    const stopVideoButton = document.getElementById("stopVideoButton");
    const videoStatusText = document.getElementById("videoStatusText");
    const videoDebugText = document.getElementById("videoDebugText");

    let mediaSource = null;
    let sourceBuffer = null;
    let mseObjectUrl = "";

    let videoRunning = false;
    let videoStarting = false;
    let videoTimer = 0;

    let nextByte = 0;
    let stash = new Uint8Array(0);

    let appendQueue = [];
    let initBoxes = [];
    let initAppended = false;
    let pendingMoof = null;
    let seenMoof = false;

    let totalFetched = 0;
    let totalAppended = 0;
    let lastAppendAt = 0;
    let selectedMime = "";

    function setVideoStatus(text) {
      if (videoStatusText) {
        videoStatusText.textContent = text || "";
      }
    }

    function setVideoDebug(text) {
      if (videoDebugText) {
        videoDebugText.textContent = text || "";
      }
    }

    function selectMimeType() {
      if (!window.MediaSource) {
        return "";
      }

      for (const mime of MIME_CANDIDATES) {
        try {
          if (MediaSource.isTypeSupported(mime)) {
            return mime;
          }
        } catch (e) {
        }
      }

      return "";
    }

    function readU32BE(bytes, offset) {
      return ((bytes[offset] << 24) >>> 0) +
             (bytes[offset + 1] << 16) +
             (bytes[offset + 2] << 8) +
             bytes[offset + 3];
    }

    function readU64BE(bytes, offset) {
      const hi = readU32BE(bytes, offset);
      const lo = readU32BE(bytes, offset + 4);
      return (hi * 4294967296) + lo;
    }

    function readBoxType(bytes, offset) {
      return String.fromCharCode(bytes[offset + 4],
                                 bytes[offset + 5],
                                 bytes[offset + 6],
                                 bytes[offset + 7]);
    }

    function concatBytes(parts) {
      let total = 0;
      for (let i = 0; i < parts.length; i++) {
        total += parts[i].byteLength;
      }

      const result = new Uint8Array(total);
      let pos = 0;

      for (let i = 0; i < parts.length; i++) {
        result.set(parts[i], pos);
        pos += parts[i].byteLength;
      }

      return result;
    }

    function appendToStash(buffer) {
      if (!buffer || buffer.byteLength === 0) {
        return;
      }

      const bytes = new Uint8Array(buffer);

      if (stash.byteLength === 0) {
        stash = bytes;
        return;
      }

      const merged = new Uint8Array(stash.byteLength + bytes.byteLength);
      merged.set(stash, 0);
      merged.set(bytes, stash.byteLength);
      stash = merged;
    }

    function takeCompleteBox() {
      if (stash.byteLength < 8) {
        return null;
      }

      let size = readU32BE(stash, 0);
      const type = readBoxType(stash, 0);
      let headerSize = 8;

      if (size === 1) {
        if (stash.byteLength < 16) {
          return null;
        }

        size = readU64BE(stash, 8);
        headerSize = 16;
      } else if (size === 0) {
        setVideoDebug("Waiting: open-ended MP4 box " + type);
        return null;
      }

      if (size < headerSize || size > 0x7fffffff) {
        throw new Error("Invalid MP4 box size for " + type + ": " + size);
      }

      if (stash.byteLength < size) {
        return null;
      }

      const box = stash.slice(0, size);
      stash = stash.slice(size);

      return {
        type: type,
        data: box
      };
    }

    function queueAppend(buffer, label) {
      if (!buffer || buffer.byteLength === 0) {
        return;
      }

      appendQueue.push({
        data: buffer,
        label: label || "segment"
      });

      pumpSourceBuffer();
    }

    function pumpSourceBuffer() {
      if (!sourceBuffer || sourceBuffer.updating || appendQueue.length === 0) {
        return;
      }

      const item = appendQueue.shift();

      try {
        sourceBuffer.appendBuffer(item.data);
        totalAppended += item.data.byteLength;
        lastAppendAt = Date.now();

        setVideoDebug(
          item.label +
          " | appended " + Math.round(totalAppended / 1024 / 1024) + " MB" +
          " | fetched " + Math.round(totalFetched / 1024 / 1024) + " MB"
        );
      } catch (e) {
        setVideoStatus("Video append failed: " + e.name);
        setVideoDebug(e.message || "");
        videoRunning = false;
      }
    }

    function processParsedBoxes() {
      let box = null;
      let boxesThisPass = [];

      while (videoRunning && (box = takeCompleteBox()) !== null) {
        boxesThisPass.push(box.type);

        if (!initAppended) {
          initBoxes.push(box.data);

          if (box.type === "moov") {
            const initSegment = concatBytes(initBoxes);
            initBoxes = [];
            initAppended = true;
            queueAppend(initSegment, "init ftyp+moov");
          }

          continue;
        }

        if (box.type === "moof") {
          seenMoof = true;

          if (pendingMoof) {
            setVideoDebug("Warning: moof without mdat");
          }

          pendingMoof = box.data;
          continue;
        }

        if (box.type === "mdat") {
          if (pendingMoof) {
            const fragment = concatBytes([pendingMoof, box.data]);
            pendingMoof = null;
            queueAppend(fragment, "fragment moof+mdat");
          } else if (!seenMoof) {
            setVideoStatus("MP4 is playable, but not MSE-fragmented yet: mdat without moof");
            setVideoDebug("Need moof+mdat fragments from Media Foundation");
          }
          continue;
        }

        if (box.type !== "free" && box.type !== "skip" && box.type !== "sidx" &&
            box.type !== "styp" && box.type !== "mfra" && box.type !== "mfro") {
          setVideoDebug("Skipped MP4 box: " + box.type);
        }
      }

      if (boxesThisPass.length > 0 && !initAppended) {
        setVideoDebug("Before init: " + boxesThisPass.join(", "));
      }
    }

    async function fetchVideoRange() {
      if (!videoRunning || !sourceBuffer) {
        return;
      }

      try {
        const endByte = nextByte + VIDEO_FETCH_CHUNK_SIZE - 1;

        const response = await fetch(VIDEO_URL + "?rdj=" + Date.now(), {
          cache: "no-store",
          headers: {
            "Range": "bytes=" + nextByte + "-" + endByte
          }
        });

        if (response.status === 416) {
          setVideoStatus("Waiting for new live MP4 bytes...");
          scheduleVideoFetch(1200);
          return;
        }

        if (response.status !== 206) {
          setVideoStatus("Waiting for live MP4... HTTP " + response.status);
          scheduleVideoFetch(1600);
          return;
        }

        const contentRange = response.headers.get("Content-Range") || "";
        const match = /bytes\s+(\d+)-(\d+)\/(\d+|\*)/i.exec(contentRange);
        const data = await response.arrayBuffer();

        if (!data || data.byteLength === 0) {
          scheduleVideoFetch(1200);
          return;
        }

        totalFetched += data.byteLength;

        if (match) {
          nextByte = Number(match[2]) + 1;
        } else {
          nextByte += data.byteLength;
        }

        appendToStash(data);
        processParsedBoxes();

        if (video && video.paused && videoStarting && initAppended && totalAppended > 0) {
          video.play().then(function() {
            videoStarting = false;
            setVideoStatus("RDJ Pro video streaming");
          }).catch(function() {
            setVideoStatus("Tap Start Live Video to allow playback");
          });
        }

        if (data.byteLength < VIDEO_FETCH_CHUNK_SIZE) {
          scheduleVideoFetch(VIDEO_POLL_MS);
        } else {
          scheduleVideoFetch(80);
        }
      } catch (e) {
        if (videoRunning) {
          setVideoStatus("Video network wait: " + e.name);
          setVideoDebug(e.message || "");
          scheduleVideoFetch(1500);
        }
      }
    }

    function scheduleVideoFetch(delay) {
      if (!videoRunning) {
        return;
      }

      window.clearTimeout(videoTimer);
      videoTimer = window.setTimeout(fetchVideoRange, delay);
    }

    function resetVideoPipeline() {
      window.clearTimeout(videoTimer);
      videoTimer = 0;

      videoRunning = false;
      videoStarting = false;

      nextByte = 0;
      stash = new Uint8Array(0);

      appendQueue = [];
      initBoxes = [];
      initAppended = false;
      pendingMoof = null;
      seenMoof = false;

      totalFetched = 0;
      totalAppended = 0;
      lastAppendAt = 0;

      sourceBuffer = null;

      if (mediaSource && mediaSource.readyState === "open") {
        try {
          mediaSource.endOfStream();
        } catch (e) {
        }
      }

      mediaSource = null;

      if (mseObjectUrl) {
        try {
          URL.revokeObjectURL(mseObjectUrl);
        } catch (e) {
        }
        mseObjectUrl = "";
      }

      if (video) {
        try {
          video.pause();
        } catch (e) {
        }

        video.removeAttribute("src");
        video.load();
      }
    }

    function startFmp4Video() {
      if (!video || videoRunning || videoStarting) {
        return;
      }

      if (!window.MediaSource) {
        setVideoStatus("Media Source Extensions are not available in this browser.");
        return;
      }

      selectedMime = selectMimeType();

      if (!selectedMime) {
        setVideoStatus("This browser does not support RDJ Pro MP4 playback.");
        return;
      }

      resetVideoPipeline();

      videoRunning = true;
      videoStarting = true;

      setVideoStatus("Connecting RDJ Pro video...");
      setVideoDebug(selectedMime);

      mediaSource = new MediaSource();
      mseObjectUrl = URL.createObjectURL(mediaSource);
      video.src = mseObjectUrl;

      mediaSource.addEventListener("sourceopen", function() {
        if (!mediaSource || mediaSource.readyState !== "open") {
          return;
        }

        try {
          sourceBuffer = mediaSource.addSourceBuffer(selectedMime);
          sourceBuffer.mode = "segments";

          sourceBuffer.addEventListener("updateend", function() {
            pumpSourceBuffer();

            if (videoRunning && appendQueue.length < 3) {
              scheduleVideoFetch(0);
            }
          });

          sourceBuffer.addEventListener("error", function() {
            setVideoStatus("Video buffer error");
          });

          fetchVideoRange();
        } catch (e) {
          setVideoStatus("Could not start video buffer: " + e.name);
          setVideoDebug(e.message || "");
          videoRunning = false;
        }
      }, { once: true });
    }

    function stopFmp4Video() {
      resetVideoPipeline();
      setVideoStatus("Video stopped");
      setVideoDebug("");
    }

    if (startVideoButton) {
      startVideoButton.addEventListener("click", startFmp4Video);
    }

    if (stopVideoButton) {
      stopVideoButton.addEventListener("click", stopFmp4Video);
    }

    if (video) {
      video.addEventListener("playing", function() {
        setVideoStatus("RDJ Pro video streaming");
      });

      video.addEventListener("waiting", function() {
        setVideoStatus("Buffering RDJ Pro video...");
        if (videoRunning && (Date.now() - lastAppendAt) > 1500) {
          scheduleVideoFetch(100);
        }
      });

      video.addEventListener("error", function() {
        setVideoStatus("Video playback unavailable");
      });
    }
    }

    function firstText() {
      for (let i = 0; i < arguments.length; i++) {
        const value = arguments[i];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return String(value).trim();
        }
      }
      return "";
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el && value !== undefined && value !== null && String(value).trim() !== "") {
        el.textContent = value;
      }
    }

    function setTextAnimated(id, value) {
      const el = document.getElementById(id);
      if (!el || value === undefined || value === null || String(value).trim() === "") {
        return;
      }
      const next = String(value).trim();
      if (el.textContent === next) {
        return;
      }
      el.textContent = next;
      el.classList.remove("text-changing");
      void el.offsetWidth;
      el.classList.add("text-changing");
    }

    function makeBrowserUrl(url, fallback) {
      const source = firstText(url, fallback);
      if (!source) {
        return "";
      }

      let value = String(source).trim();
      const isWebUrl = /^(https?:)?\/\//i.test(value);
      const queryIndex = value.indexOf("?");
      const query = queryIndex >= 0 ? value.substring(queryIndex) : "";
      let pathOnly = queryIndex >= 0 ? value.substring(0, queryIndex) : value;

      pathOnly = pathOnly.replace(/%5c/gi, "/").replace(/\\/g, "/");
      const fileName = pathOnly.substring(pathOnly.lastIndexOf("/") + 1).toLowerCase();
      const hasRelativePath = pathOnly.indexOf("/") >= 0;
      const looksLikeDiskPath = /^[a-z]:\//i.test(pathOnly) || pathOnly.indexOf("//") === 0;

      if (hasRelativePath && !looksLikeDiskPath && !isWebUrl &&
          value.charAt(0) !== "/" && value.charAt(0) !== ".") {
        return "/" + pathOnly + query;
      }

      if (fileName === "cover.jpg" || fileName === "cover.jpeg" ||
          fileName === "cover.png" || fileName === "cover.webp") {
        const ext = fileName.substring(fileName.lastIndexOf(".") + 1).replace("jpeg", "jpg");
        return "/cover." + ext + query;
      }

      if (fileName === "cover_default.jpg" || fileName === "cover_default.jpeg" ||
          fileName === "cover_default.png" || fileName === "cover_default.webp") {
        const ext = fileName.substring(fileName.lastIndexOf(".") + 1).replace("jpeg", "jpg");
        return "/cover_default." + ext + query;
      }

      if (fileName === "hero.jpg" || fileName === "hero.jpeg" ||
          fileName === "hero.png" || fileName === "hero.webp") {
        const ext = fileName.substring(fileName.lastIndexOf(".") + 1).replace("jpeg", "jpg");
        return "/hero." + ext + query;
      }

      if (isWebUrl || value.charAt(0) === "/" || value.charAt(0) === ".") {
        return value;
      }

      return "/" + value;
    }

    function setImage(id, url) {
      const safeUrl = makeBrowserUrl(url, "");
      if (!safeUrl) {
        return;
      }

      const el = document.getElementById(id);
      if (!el) {
        return;
      }

      el.onerror = function() {
        if (el.src.indexOf("/cover_default.") === -1) {
          el.onerror = null;
          el.src = "/cover_default.jpg?ts=" + Date.now();
        }
      };
      el.src = safeUrl;
    }

    function setCover(url) {
      const cover = makeBrowserUrl(firstText(url, DEFAULT_INFO.coverUrl, "cover_default.jpg"), "/cover_default.jpg");
      const frame = document.getElementById("coverFrame");
      setImage("coverImage", cover);
      if (frame) {
        frame.style.setProperty("--cover-bg", "url('" + cover.replace(/'/g, "\\'") + "')");
      }
    }

    function applyNowPlaying(info) {
      const live = info || {};
      const displayDjName = firstText(live.djName, live.dj, DEFAULT_INFO.djName);
      const displayShowName = firstText(live.show, live.showName, live.showTitle, DEFAULT_INFO.showName);
      const displayTitle = firstText(live.title, DEFAULT_INFO.title);
      const displayArtist = firstText(live.artist, DEFAULT_INFO.artist);
      const displayListeners = firstText(live.displayListeners, live.listeners, live.listenerCount, live.currentListeners, DEFAULT_INFO.displayListeners, DEFAULT_INFO.listeners);
      const displayStation = firstText(live.station, DEFAULT_INFO.station);
      const displayCover = firstText(live.coverUrl, live.artwork, live.albumArt, live.cover, live.image, DEFAULT_INFO.coverUrl);

      setTextAnimated("playerDjName", displayDjName);
      setTextAnimated("playerShowName", displayShowName);
      setTextAnimated("trackArtist", displayArtist);
      setTextAnimated("trackTitle", displayTitle);
      setText("listeners", displayListeners);
      setCover(displayCover);
      document.title = displayStation + " - " + displayTitle;
      setImage("heroImage", firstText(live.heroImage, DEFAULT_INFO.heroImage, "hero.jpg"));
    }

    async function loadNowPlaying() {
      try {
        const response = await fetch("/nowplaying.json?ts=" + Date.now(), { cache: "no-store" });
        if (!response.ok) {
          applyNowPlaying(DEFAULT_INFO);
          return;
        }
        const info = await response.json();
        applyNowPlaying(info);
      } catch (e) {
        applyNowPlaying(DEFAULT_INFO);
      }
    }
    
  /*
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("/sw.js").catch(function() {});
      });
    }
  */

    document.getElementById("year").textContent = new Date().getFullYear();
    setCover("cover_default.jpg");
    loadNowPlaying();
    setInterval(loadNowPlaying, 10000);
  </script>
</body>
</html>
