<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FactoryXradio</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#02070d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FactoryXradio">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <style>
    :root {
      --bg: #02070d;
      --panel: rgba(4, 18, 28, 0.88);
      --panel-2: rgba(7, 29, 43, 0.84);
      --line: rgba(0, 229, 255, 0.30);
      --line-strong: rgba(0, 229, 255, 0.55);
      --text: #f5fbff;
      --muted: #9bb2bf;
      --cyan: #00e5ff;
      --green: #46ff9a;
      --blue: #168cff;
      --red: #ff3860;
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.55);
      --radius: 22px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 18% 8%, rgba(0, 229, 255, 0.13), transparent 34%),
        radial-gradient(circle at 90% 28%, rgba(70, 255, 154, 0.12), transparent 32%),
        linear-gradient(135deg, #01040a 0%, #061320 52%, #02060b 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: radial-gradient(circle at 50% 20%, black, transparent 78%);
    }

    a, button { color: inherit; }
    button { font-family: inherit; }

    .page {
      width: min(1180px, calc(100% - 24px));
      margin: 0 auto;
      padding: 12px 0 calc(32px + var(--safe-bottom));
    }

    .shell {
      overflow: hidden;
      border: 1px solid rgba(0,229,255,.24);
      border-radius: 26px;
      background: rgba(1, 8, 14, .54);
      box-shadow: var(--shadow);
    }

    .hero {
      position: relative;
      overflow: hidden;
      background: #03101a;
      border-bottom: 1px solid rgba(0,229,255,.20);
      aspect-ratio: 1536 / 509;
    }

    .hero-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      background: #03101a;
    }

    .onair-card,
    .now-card,
    .player-card {
      margin: 18px;
      border: 1px solid rgba(0,229,255,.24);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 20% 20%, rgba(0,229,255,.10), transparent 36%),
        linear-gradient(135deg, rgba(5, 18, 28, .95), rgba(3, 10, 18, .93));
      box-shadow: 0 18px 58px rgba(0,0,0,.42);
      backdrop-filter: blur(18px);
    }

    .onair-card {
      display: grid;
      grid-template-columns: 1fr 1.45fr;
      gap: 28px;
      align-items: center;
      padding: 32px 42px;
    }

    .onair-left {
      display: grid;
      gap: 14px;
      border-right: 1px solid rgba(155,178,191,.32);
      padding-right: 34px;
    }

    .onair-label,
    .now-label,
    .live-label {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--green);
      font-size: clamp(18px, 2vw, 26px);
      font-weight: 900;
      letter-spacing: .6px;
      text-transform: uppercase;
    }

    .now-label,
    .live-label {
      color: var(--cyan);
      font-size: clamp(16px, 1.7vw, 22px);
    }

    .onair-dot,
    .status-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 22px var(--green);
      animation: onAirPulse 1.35s ease-in-out infinite;
      flex: 0 0 auto;
    }

    @keyframes onAirPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(0.68); opacity: 0.56; }
    }

    .dj-name {
      font-size: clamp(32px, 4vw, 56px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -1px;
      overflow-wrap: anywhere;
    }

    .show-wrap {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    .live-script {
      color: var(--cyan);
      font-family: "Segoe Script", "Brush Script MT", cursive;
      font-size: clamp(36px, 5vw, 64px);
      line-height: .95;
      text-shadow: 0 0 22px rgba(0,229,255,.50);
    }

    .show-title {
      font-size: clamp(22px, 2.6vw, 34px);
      font-weight: 700;
      line-height: 1.16;
      overflow-wrap: anywhere;
    }

    .now-card {
      display: grid;
      grid-template-columns: minmax(240px, 430px) 1fr;
      gap: 42px;
      align-items: center;
      padding: 30px 34px;
      transition: border-color .35s ease, box-shadow .35s ease, transform .35s ease;
    }

    .now-card.track-updated {
      border-color: rgba(70,255,154,.58);
      box-shadow: 0 22px 70px rgba(0,0,0,.55), 0 0 34px rgba(70,255,154,.18);
      transform: translateY(-1px);
    }

    .cover-panel {
      display: grid;
      gap: 20px;
      min-width: 0;
      width: 100%;
    }

    .cover-frame {
      position: relative;
      width: 100%;
      max-width: 560px;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(0,229,255,.42);
      background: #04101a;
      box-shadow: 0 0 44px rgba(0,229,255,.14);
      contain: paint;
    }

    .cover-frame::before {
      content: "";
      position: absolute;
      inset: -24px;
      background: var(--cover-bg, none) center / cover no-repeat;
      filter: blur(22px);
      opacity: .32;
      transform: scale(1.08);
    }

    .cover-frame img {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      max-width: none;
      max-height: none;
      object-fit: cover;
      object-position: center center;
    }

    .track-panel {
      display: grid;
      grid-template-columns: 1fr;
      gap: 26px;
      min-width: 0;
    }

    .track-grid {
      display: grid;
      gap: 22px;
    }

    .field-label {
      color: var(--cyan);
      font-size: clamp(16px, 1.8vw, 22px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 8px;
    }

    .track-artist,
    .track-title {
      color: var(--text);
      font-size: clamp(34px, 4vw, 54px);
      font-weight: 900;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .track-title { font-size: clamp(36px, 4.6vw, 62px); }

    .info-row {
      display: grid;
      grid-template-columns: minmax(150px, auto) 1px minmax(180px, auto);
      gap: 28px;
      align-items: center;
      margin-top: 8px;
    }

    .divider {
      width: 1px;
      height: 84px;
      background: rgba(155,178,191,.32);
    }

    .listeners,
    .stream-state {
      display: grid;
      gap: 10px;
    }

    .listener-number {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: clamp(18px, 3vw, 2px);
      font-weight: 900;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      width: max-content;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1px solid rgba(0,229,255,.28);
      background: rgba(0,229,255,.08);
      color: var(--green);
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: inset 0 0 18px rgba(0,229,255,.07);
    }

    .player-card {
      position: sticky;
      bottom: calc(12px + var(--safe-bottom));
      z-index: 20;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 28px;
      align-items: center;
      padding: 28px 36px;
    }

    .volume-line {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 16px;
      align-items: center;
      color: var(--text);
      min-width: 0;
    }

    .volume-icon {
      font-size: 26px;
      opacity: .92;
    }

    .volume-slider {
      width: 100%;
      accent-color: var(--cyan);
    }

    .play-round {
      width: 138px;
      height: 138px;
      border-radius: 50%;
      border: 3px solid var(--cyan);
      background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.18), rgba(0,229,255,.09));
      display: grid;
      place-items: center;
      color: var(--text);
      box-shadow:
        0 0 34px rgba(0,229,255,.34),
        0 0 58px rgba(70,255,154,.18),
        inset 0 0 24px rgba(0,229,255,.11);
      font-size: 56px;
      font-weight: 900;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
      -webkit-tap-highlight-color: transparent;
      position: relative;
      overflow: visible;
    }

    .play-round:active { transform: scale(.95); }

    .play-round::before {
      content: "";
      position: absolute;
      left: -170px;
      right: -170px;
      height: 70px;
      top: 50%;
      transform: translateY(-50%);
      z-index: -1;
      opacity: .36;
      background:
        repeating-linear-gradient(90deg,
          transparent 0 9px,
          rgba(0,229,255,.42) 9px 12px,
          transparent 12px 20px);
      mask-image: radial-gradient(ellipse at center, black, transparent 72%);
      animation: waveMove 2.8s linear infinite;
    }

    @keyframes waveMove {
      from { background-position-x: 0; }
      to { background-position-x: 80px; }
    }

    body:not(.is-playing) .play-round::before { animation-play-state: paused; opacity: .14; }

    .play-round::after {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px solid rgba(70,255,154,.0);
      transform: scale(.86);
      opacity: 0;
      pointer-events: none;
    }

    .play-round.ripple::after { animation: buttonRipple .55s ease-out; }

    @keyframes buttonRipple {
      0% { transform: scale(.86); opacity: .7; border-color: rgba(70,255,154,.75); }
      100% { transform: scale(1.34); opacity: 0; border-color: rgba(70,255,154,0); }
    }

    .is-playing .play-round {
      border-color: var(--green);
      box-shadow:
        0 0 40px rgba(70,255,154,.34),
        0 0 70px rgba(0,229,255,.22),
        inset 0 0 24px rgba(70,255,154,.12);
    }

    .is-loading .play-round {
      color: var(--cyan);
      animation: connectGlow 1s ease-in-out infinite;
      cursor: wait;
    }

    .is-error .play-round {
      color: var(--red);
      border-color: rgba(255,56,96,.75);
      box-shadow: 0 0 28px rgba(255,56,96,.28), inset 0 0 18px rgba(255,56,96,.08);
    }

    @keyframes connectGlow {
      0%, 100% { box-shadow: 0 0 22px rgba(0,229,255,.24), inset 0 0 18px rgba(0,229,255,.08); }
      50% { box-shadow: 0 0 42px rgba(0,229,255,.44), inset 0 0 24px rgba(0,229,255,.14); }
    }

    .player-actions {
      display: grid;
      gap: 12px;
      justify-items: end;
    }

    .quality-line {
      color: var(--muted);
      font-size: 18px;
      font-weight: 900;
      text-transform: uppercase;
      text-align: right;
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 20px;
      border-radius: 14px;
      border: 1px solid rgba(0,229,255,.45);
      background: rgba(0,229,255,.07);
      color: var(--text);
      font-weight: 900;
      text-decoration: none;
      text-transform: uppercase;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn.primary {
      color: #031016;
      border: 0;
      background: linear-gradient(135deg, var(--cyan), var(--green));
      box-shadow: 0 0 24px rgba(0,229,255,.22);
    }


    .install-panel {
      grid-column: 1 / -1;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: -4px;
      padding-top: 2px;
      text-align: center;
    }

    .install-panel.show {
      display: flex;
      flex-wrap: wrap;
    }

    .install-help {
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .2px;
      text-transform: uppercase;
    }

    .player-message {
      grid-column: 1 / -1;
      display: none;
      margin-top: -8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .3px;
      text-transform: uppercase;
      text-align: center;
    }

    .player-message.show { display: block; animation: textChange .25s ease both; }

    .audio-wrap {
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      position: absolute;
    }

    .text-changing { animation: textChange .42s ease both; }
    .track-glow { animation: trackGlow .95s ease-out; }

    @keyframes textChange {
      0% { opacity: .18; transform: translateY(10px); filter: blur(3px); }
      60% { opacity: 1; transform: translateY(0); filter: blur(0); }
      100% { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes trackGlow {
      0% { color: var(--green); text-shadow: 0 0 22px rgba(70,255,154,.68); }
      100% { color: var(--text); text-shadow: none; }
    }

    .dj-live-flash { animation: djLiveFlash 1.2s ease-out; }

    @keyframes djLiveFlash {
      0% { color: var(--green); text-shadow: 0 0 24px rgba(70,255,154,.75); }
      100% { color: var(--text); text-shadow: none; }
    }

    footer {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 12px;
      align-items: center;
      padding: 22px 26px 24px;
      color: var(--muted);
      border-top: 1px solid rgba(0,229,255,.16);
    }

    footer b { color: var(--cyan); }
    .connection { color: var(--green); font-weight: 800; }
    .copyright { text-align: right; }

    @media (max-width: 900px) {
      .onair-card,
      .now-card,
      .player-card {
        margin: 12px;
      }

      .onair-card {
        grid-template-columns: 1fr;
        padding: 24px;
      }

      .onair-left {
        border-right: 0;
        border-bottom: 1px solid rgba(155,178,191,.28);
        padding-right: 0;
        padding-bottom: 22px;
      }

      .now-card {
        grid-template-columns: 1fr;
        padding: 24px;
      }

      .cover-frame {
        width: min(100%, 460px);
        max-width: 460px;
        margin: 0 auto;
      }

      .player-card {
        grid-template-columns: 1fr;
        justify-items: center;
        padding: 24px;
      }

      .volume-line,
      .player-actions {
        width: 100%;
      }

      .player-actions { justify-items: center; }
      .quality-line { text-align: center; }
      .button-row { justify-content: center; }
    }

    @media (max-width: 620px) {
      .page { width: calc(100% - 16px); padding-top: 8px; }
      .shell { border-radius: 20px; }
      .hero-img { height: 100%; }
      .onair-card,
      .now-card,
      .player-card { border-radius: 18px; }
      .dj-name { font-size: clamp(30px, 9vw, 42px); }
      .show-title { font-size: clamp(20px, 6vw, 28px); }
      .live-script { font-size: clamp(34px, 11vw, 52px); }
      .track-artist,
      .track-title { font-size: clamp(30px, 10vw, 46px); }

      .cover-frame {
        width: min(100%, 380px);
        max-width: 380px;
      }
      .info-row {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .divider { display: none; }

      /* Mobile: keep the player always visible at the bottom */
      .player-card {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: calc(8px + var(--safe-bottom));
        z-index: 100;
        margin: 0;
        padding: 14px;
        grid-template-columns: 1fr auto;
        gap: 12px;
        border-radius: 18px;
      }

      .play-round {
        width: 78px;
        height: 78px;
        font-size: 34px;
      }

      .play-round::before {
        left: -80px;
        right: -80px;
        height: 44px;
      }

      .volume-line {
        grid-column: 1;
        width: 100%;
      }

      .player-actions {
        grid-column: 1 / -1;
        width: 100%;
      }

      .quality-line {
        display: none;
      }

      .button-row {
        width: 100%;
        justify-content: center;
      }

      .btn {
        min-height: 44px;
        padding: 0 14px;
        font-size: 13px;
      }

      .install-panel,
      .player-message {
        grid-column: 1 / -1;
      }

      main {
        padding-bottom: 190px;
      }
      footer {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .copyright { text-align: center; }
    }

    /* Half-size text override only. No layout, cover, or player logic changes. */
    .onair-label {
      font-size: clamp(9px, 1vw, 13px);
    }

    .now-label,
    .live-label {
      font-size: clamp(8px, .85vw, 11px);
    }

    .dj-name {
      font-size: clamp(16px, 2vw, 28px);
    }

    .live-script {
      font-size: clamp(18px, 2.5vw, 32px);
    }

    .show-title {
      font-size: clamp(11px, 1.3vw, 17px);
    }

    .field-label {
      font-size: clamp(8px, .9vw, 11px);
    }

    .track-artist {
      font-size: clamp(17px, 2vw, 27px);
    }

    .track-title {
      font-size: clamp(18px, 2.3vw, 31px);
    }

    .listener-number {
      font-size: clamp(9px, 1.5vw, 16px);
    }

    .volume-icon {
      font-size: 13px;
    }

    .play-round {
      font-size: 28px;
    }

    .quality-line {
      font-size: 9px;
    }

    .btn {
      font-size: 8px;
    }

    .install-help,
    .player-message {
      font-size: 7px;
    }

    footer {
      font-size: 8px;
    }

    @media (max-width: 620px) {
      .dj-name {
        font-size: clamp(15px, 4.5vw, 21px);
      }

      .show-title {
        font-size: clamp(10px, 3vw, 14px);
      }

      .live-script {
        font-size: clamp(17px, 5.5vw, 26px);
      }

      .track-artist,
      .track-title {
        font-size: clamp(15px, 5vw, 23px);
      }

      .play-round {
        font-size: 17px;
      }

      .btn {
        font-size: 7px;
      }
    }


    /* Now Playing label-to-artist spacing adjustment only. */
    .now-card {
      gap: 18px;
    }

    .cover-panel {
      gap: 6px;
    }

    .track-panel {
      gap: 6px;
    }

    @media (max-width: 620px) {
      .now-card {
        gap: 10px;
      }

      .cover-panel {
        gap: 4px;
      }

      .track-panel {
        gap: 4px;
      }
    }


    /* DJ name / show title final spacing and size adjustment only. */
    .show-title {
      font-size: clamp(16px, 2vw, 28px);
      line-height: 1.05;
    }

    .onair-left,
    .show-wrap {
      gap: 6px;
    }

    @media (max-width: 620px) {
      .show-title {
        font-size: clamp(15px, 4.5vw, 21px);
        line-height: 1.05;
      }

      .onair-left,
      .show-wrap {
        gap: 4px;
      }
    }


    /* Compact listeners / live stream row adjustment only. */
    .info-row {
      grid-template-columns: minmax(120px, auto) 1px minmax(140px, auto);
      gap: 12px;
      align-items: center;
    }

    .listeners,
    .stream-state {
      gap: 5px;
    }

    .live-pill,
    .live-pill span {
      font-size: 8px;
      line-height: 1;
    }

    #streamStatusText {
      font-size: 8px;
      line-height: 1;
    }

    @media (max-width: 620px) {
      .info-row {
        grid-template-columns: auto auto;
        gap: 8px;
        align-items: end;
      }

      .divider {
        display: none;
      }

      .listeners,
      .stream-state {
        gap: 3px;
        min-width: 0;
      }

      .field-label,
      .live-label {
        font-size: 8px;
        line-height: 1;
        white-space: nowrap;
      }

      .listener-number {
        gap: 5px;
        font-size: 8px;
        line-height: 1;
        white-space: nowrap;
      }

      .live-pill {
        padding: 6px 8px;
        gap: 5px;
        font-size: 8px;
        line-height: 1;
        white-space: nowrap;
      }

      .status-dot {
        width: 9px;
        height: 9px;
      }

      #streamStatusText {
        font-size: 8px;
        line-height: 1;
      }
    }

  </style>
</head>
<body>
  <div class="page">
    <div class="shell">
      <section class="hero" aria-label="FactoryXradio banner">
        <img id="heroImage" class="hero-img" src="hero.jpg" alt="FactoryXradio">
      </section>

      <section class="onair-card" aria-label="Current live show">
        <div class="onair-left">
          <div class="onair-label"><span class="onair-dot"></span>On Air Now With:</div>
          <div class="dj-name" id="playerDjName">DJ Charlie</div>
        </div>
        <div class="show-wrap">
          <!-- <div class="live-script">Tuned in</div> -->
          <div class="show-title" id="playerShowName">FactoryXradio Live</div>
        </div>
      </section>

      <main>
        <section class="now-card" aria-label="Now playing">
          <div class="cover-panel">
            <div class="cover-frame" id="coverFrame">
              <img id="coverImage" src="cover_default.jpg" alt="Current artwork" onerror="this.onerror=null;this.src='/cover_default.jpg';">
            </div>
            <div class="now-label">▥ Now Playing</div>
          </div>

          <div class="track-panel">
            <div class="track-grid">
              <div>
                <!-- <div class="field-label">Artist</div> -->
                <div class="track-artist" id="trackArtist">Only the best music 24/7</div>
              </div>
              <div>
                <!-- <div class="field-label">Song</div> -->
                <div class="track-title" id="trackTitle">Live Broadcast</div>
              </div>
            </div>

            <div class="info-row">
              <div class="listeners">
                <div class="field-label">Listeners</div>
                <div class="listener-number"><span id="listeners">67</span><span class="live-pill">Tuned inn</span></div>
              </div>
              <div class="divider" aria-hidden="true"></div>
              <div class="stream-state">
                <div class="live-label">⌁ Live Stream</div>
                <div class="live-pill"><span class="status-dot"></span><span id="streamStatusText">Streaming</span></div>
              </div>
            </div>
          </div>
        </section>

        <section class="player-card" aria-label="FactoryXradio player">
          <div class="volume-line">
            <span class="volume-icon">🔈</span>
            <input class="volume-slider" id="volumeSlider" type="range" min="0" max="100" value="80" aria-label="Volume">
          </div>

          <button class="play-round" id="playButton" type="button" aria-label="Play live stream">▶</button>

          <div class="player-actions">
            <div class="quality-line">Stream quality</div>
            <div class="button-row">
              <a class="btn" href="/live" target="_blank" rel="noopener">Open Stream</a>
              <button class="btn primary" id="shareButton" type="button">Share</button>
              <button class="btn" id="installAppButton" type="button">Install App</button>
            </div>
          </div>

          <div class="install-panel" id="installPanel" aria-live="polite">
            <div class="install-help" id="installHelpText"></div>
          </div>

          <div class="audio-wrap">
            <audio id="streamAudio" preload="none">
              <source src="/live" type="audio/aac">
              Your browser does not support the audio player.
            </audio>
          </div>
          <div class="player-message" id="playerMessage" aria-live="polite"></div>
        </section>
      </main>

      <footer>
        <div class="connection">⌁ Connection: Excellent</div>
        <div><b>FactoryXradio</b> — Only The Best Music 24/7</div>
        <div class="copyright">© <span id="year"></span> FactoryXradio</div>
      </footer>
    </div>
  </div>

  <script>
    const DEFAULT_INFO = {
      station: "FactoryXradio",
      dj: "DJ Charlie",
      djName: "DJ Charlie",
      showName: "FactoryXradio Live",
      showTitle: "FactoryXradio Live",
      show: "FactoryXradio Live",
      title: "Live Broadcast",
      artist: "Only the best music 24/7",
      listeners: "67",
      displayListeners: "67",
      logo: "factoryx-logo.jpg",
      heroImage: "hero.jpg",
      coverUrl: "cover_default.jpg"
    };

    const audio = document.getElementById("streamAudio");
    const playButton = document.getElementById("playButton");
    const shareButton = document.getElementById("shareButton");
    const installAppButton = document.getElementById("installAppButton");
    const installPanel = document.getElementById("installPanel");
    const installHelpText = document.getElementById("installHelpText");
    const playerMessage = document.getElementById("playerMessage");
    const volumeSlider = document.getElementById("volumeSlider");
    const STREAM_URL = "/live";

    let userWantsPlay = false;
    let reconnectTimer = 0;
    let reconnectAttempt = 0;
    let lastDjName = "";
    let lastTrackKey = "";
    let trackPulseTimer = 0;
    let currentState = "stopped";
    let watchdogTimer = 0;
    let lastWatchdogActivity = Date.now();
    let lastReadyState = 0;
    let wasRecovering = false;
    let reconnectLockUntil = 0;
    let deferredInstallPrompt = null;
    let installNudgeTimer = 0;
    let installNudgeShown = false;


    function isIosDevice() {
      return /iphone|ipad|ipod/i.test(window.navigator.userAgent);
    }

    function isStandaloneApp() {
      return window.matchMedia("(display-mode: standalone)").matches ||
             window.navigator.standalone === true;
    }

    function showInstallHelp(text) {
      if (!installPanel || !installHelpText || !text) {
        return;
      }

      installHelpText.textContent = text;
      installPanel.classList.add("show");
    }

    function hideInstallHelp() {
      if (installPanel) {
        installPanel.classList.remove("show");
      }
      if (installHelpText) {
        installHelpText.textContent = "";
      }
    }

    function getInstallGuideText() {
      if (isStandaloneApp()) {
        return "FactoryXradio is already installed.";
      }

      if (isIosDevice()) {
        return "iPhone/iPad: tap Share, then Add to Home Screen.";
      }

      return "Install from the browser menu ⋮, then choose Install app or Add to Home screen.";
    }

    function updateInstallUi() {
      if (!installAppButton) {
        return;
      }

      if (isStandaloneApp()) {
        installAppButton.hidden = true;
        hideInstallHelp();
        return;
      }

      // Keep the button visible. Chromium browsers only allow a direct install
      // prompt after beforeinstallprompt has fired. Until then this button acts
      // as a reliable install guide instead of appearing dead.
      installAppButton.hidden = false;

      if (deferredInstallPrompt) {
        installAppButton.textContent = "Install App";
        hideInstallHelp();
      } else {
        installAppButton.textContent = "Install Help";
        showInstallHelp(getInstallGuideText());
      }
    }

    function showInstallGuide(sticky) {
      const text = getInstallGuideText();
      showInstallHelp(text);
      showPlayerMessage(text, !!sticky);
    }

    function scheduleInstallNudge() {
      window.clearTimeout(installNudgeTimer);

      if (installNudgeShown || isStandaloneApp()) {
        return;
      }

      installNudgeTimer = window.setTimeout(function() {
        if (installNudgeShown || isStandaloneApp()) {
          return;
        }

        installNudgeShown = true;

        if (deferredInstallPrompt) {
          showPlayerMessage("Tip: install FactoryXradio as an app", false);
        } else {
          showPlayerMessage("Tip: install from browser menu ⋮", false);
        }

        updateInstallUi();
      }, 10000);
    }

    function firstText() {
      for (let i = 0; i < arguments.length; i++) {
        const value = arguments[i];
        if (value !== undefined && value !== null && String(value).trim() !== "") {
          return String(value).trim();
        }
      }
      return "";
    }

    function setText(id, value) {
      const el = document.getElementById(id);
      if (el && value !== undefined && value !== null && String(value).trim() !== "") {
        el.textContent = value;
      }
    }

    function setTextAnimated(id, value, flashLive) {
      const el = document.getElementById(id);
      if (!el || value === undefined || value === null || String(value).trim() === "") {
        return;
      }

      const next = String(value).trim();
      if (el.textContent === next) {
        return;
      }

      el.textContent = next;
      el.classList.remove("text-changing", "dj-live-flash");
      void el.offsetWidth;
      el.classList.add("text-changing");

      if (flashLive) {
        el.classList.add("dj-live-flash");
      }
    }

    function pulseNowCard() {
      const card = document.querySelector(".now-card");
      if (!card) {
        return;
      }

      card.classList.remove("track-updated");
      void card.offsetWidth;
      card.classList.add("track-updated");

      window.clearTimeout(trackPulseTimer);
      trackPulseTimer = window.setTimeout(() => {
        card.classList.remove("track-updated");
      }, 1150);
    }

    function setTextSmooth(id, value, delay, glow) {
      window.setTimeout(() => {
        const el = document.getElementById(id);
        if (!el || value === undefined || value === null || String(value).trim() === "") {
          return;
        }

        const next = String(value).trim();
        if (el.textContent === next) {
          return;
        }

        el.textContent = next;
        el.classList.remove("text-changing", "track-glow");
        void el.offsetWidth;
        el.classList.add("text-changing");

        if (glow) {
          el.classList.add("track-glow");
        }
      }, delay || 0);
    }

    function showPlayerMessage(text, sticky) {
      if (!playerMessage) {
        return;
      }

      playerMessage.textContent = text || "";
      playerMessage.classList.toggle("show", !!text);

      if (text && !sticky) {
        window.clearTimeout(playerMessage._hideTimer);
        playerMessage._hideTimer = window.setTimeout(() => {
          playerMessage.classList.remove("show");
        }, 2200);
      }
    }

    function makeBrowserUrl(url, fallback) {
      const source = firstText(url, fallback);
      if (!source) {
        return "";
      }

      let value = String(source).trim();

      const isWebUrl = /^(https?:)?\/\//i.test(value);
      const queryIndex = value.indexOf("?");
      const query = queryIndex >= 0 ? value.substring(queryIndex) : "";
      let pathOnly = queryIndex >= 0 ? value.substring(0, queryIndex) : value;

      pathOnly = pathOnly.replace(/%5c/gi, "/").replace(/\\/g, "/");

      const fileName = pathOnly.substring(pathOnly.lastIndexOf("/") + 1).toLowerCase();

      if (fileName === "cover.jpg" ||
          fileName === "cover.jpeg" ||
          fileName === "cover.png" ||
          fileName === "cover.webp") {
        const ext = fileName.substring(fileName.lastIndexOf(".") + 1).replace("jpeg", "jpg");
        return "/cover." + ext + query;
      }

      if (fileName === "cover_default.jpg" ||
          fileName === "cover_default.jpeg" ||
          fileName === "cover_default.png" ||
          fileName === "cover_default.webp") {
        const ext = fileName.substring(fileName.lastIndexOf(".") + 1).replace("jpeg", "jpg");
        return "/cover_default." + ext + query;
      }

      if (fileName === "hero.jpg" ||
          fileName === "hero.jpeg" ||
          fileName === "hero.png" ||
          fileName === "hero.webp") {
        const ext = fileName.substring(fileName.lastIndexOf(".") + 1).replace("jpeg", "jpg");
        return "/hero." + ext + query;
      }

      if (isWebUrl || value.charAt(0) === "/" || value.charAt(0) === ".") {
        return value;
      }

      return "/" + value;
    }

    function setImage(id, url) {
      const safeUrl = makeBrowserUrl(url, "");
      if (!safeUrl) {
        return;
      }

      const el = document.getElementById(id);
      if (!el) {
        return;
      }

      el.onerror = function() {
        if (el.src.indexOf("/cover_default.") === -1) {
          el.onerror = null;
          el.src = "/cover_default.jpg?ts=" + Date.now();
        }
      };

      el.src = safeUrl;
    }

    function setCover(url) {
      const cover = makeBrowserUrl(firstText(url, DEFAULT_INFO.coverUrl, "cover_default.jpg"), "/cover_default.jpg");
      const frame = document.getElementById("coverFrame");

      setImage("coverImage", cover);

      if (frame) {
        frame.style.setProperty("--cover-bg", "url('" + cover.replace(/'/g, "\'") + "')");
      }
    }

    function setPlayerState(state, message) {
      currentState = state;

      document.body.classList.toggle("is-playing", state === "playing");
      document.body.classList.toggle("is-loading", state === "loading" || state === "reconnecting");
      document.body.classList.toggle("is-error", state === "error");

      playButton.disabled = (state === "loading" || state === "reconnecting");

      if (state === "playing") {
        playButton.textContent = "❚❚";
        playButton.setAttribute("aria-label", "Pause live stream");
        setText("streamStatusText", "Streaming");
        showPlayerMessage("", false);
      } else if (state === "loading") {
        playButton.textContent = "…";
        playButton.setAttribute("aria-label", "Connecting to live stream");
        setText("streamStatusText", "Connecting");
        showPlayerMessage(message || "Connecting to FactoryXradio...", true);
      } else if (state === "reconnecting") {
        playButton.textContent = "…";
        playButton.setAttribute("aria-label", "Reconnecting to live stream");
        setText("streamStatusText", "Reconnecting");
        showPlayerMessage(message || "Reconnecting to FactoryXradio...", true);
      } else if (state === "error") {
        playButton.textContent = "!";
        playButton.setAttribute("aria-label", "Stream unavailable");
        setText("streamStatusText", "Offline");
        showPlayerMessage(message || "Stream unavailable. Tap Play again.", true);
      } else {
        playButton.textContent = "▶";
        playButton.setAttribute("aria-label", "Play live stream");
        setText("streamStatusText", "Ready");
        showPlayerMessage("", false);
      }
    }

    function applyNowPlaying(info) {
      const live = info || {};
      const data = Object.assign({}, DEFAULT_INFO, live);

      const displayDjName = firstText(live.djName, live.dj, DEFAULT_INFO.djName);
      const displayShowName = firstText(live.show, live.showName, live.showTitle, DEFAULT_INFO.showName);
      const displayTitle = firstText(live.title, DEFAULT_INFO.title);
      const displayArtist = firstText(live.artist, DEFAULT_INFO.artist);
      const displayListeners = firstText(live.displayListeners, live.listeners, live.listenerCount, live.currentListeners, DEFAULT_INFO.displayListeners, DEFAULT_INFO.listeners);
      const displayStation = firstText(live.station, DEFAULT_INFO.station);
      const displayCover = firstText(live.coverUrl, live.artwork, live.albumArt, live.cover, live.image, DEFAULT_INFO.coverUrl);

      const djChanged = (lastDjName !== "" && lastDjName !== displayDjName);
      const trackKey = displayTitle + "\n" + displayArtist;
      const trackChanged = (lastTrackKey !== "" && lastTrackKey !== trackKey);

      lastDjName = displayDjName;
      lastTrackKey = trackKey;

      setTextAnimated("playerDjName", displayDjName, djChanged);
      setTextAnimated("playerShowName", displayShowName, false);

      if (trackChanged) {
        pulseNowCard();
        setTextSmooth("trackArtist", displayArtist, 0, true);
        setTextSmooth("trackTitle", displayTitle, 130, true);
      } else {
        setTextAnimated("trackArtist", displayArtist, false);
        setTextAnimated("trackTitle", displayTitle, false);
      }

      setText("listeners", displayListeners);
      setCover(displayCover);

      if (djChanged) {
        showPlayerMessage("Now live: " + displayDjName, false);
      } else if (trackChanged) {
        showPlayerMessage("Now playing updated", false);
      }

      document.title = displayStation + " - " + displayTitle;
      setImage("heroImage", firstText(data.heroImage, "hero.jpg"));
    }

    async function loadNowPlaying() {
      try {
        const response = await fetch("/nowplaying.json?ts=" + Date.now(), { cache: "no-store" });
        if (!response.ok) {
          applyNowPlaying(DEFAULT_INFO);
          return;
        }
        const info = await response.json();
        applyNowPlaying(info);
      } catch (e) {
        applyNowPlaying(DEFAULT_INFO);
      }
    }

    function clearReconnect() {
      window.clearTimeout(reconnectTimer);
      reconnectTimer = 0;
      reconnectAttempt = 0;
    }

    function stopWatchdog() {
      window.clearInterval(watchdogTimer);
      watchdogTimer = 0;
    }

    function startWatchdog() {
      stopWatchdog();
      lastWatchdogActivity = Date.now();
      lastReadyState = audio ? audio.readyState : 0;

      watchdogTimer = window.setInterval(() => {
        if (!audio || audio.paused || !userWantsPlay) {
          return;
        }

        const now = Date.now();

        if ((now - lastWatchdogActivity) > 30000) {
          loadNowPlaying();
          lastWatchdogActivity = now;
        }

        if (audio.readyState > lastReadyState) {
          lastReadyState = audio.readyState;
        }

        if (audio.networkState === HTMLMediaElement.NETWORK_NO_SOURCE) {
          scheduleReconnect("no-source");
        }
      }, 5000);
    }

    async function playStream(isReconnect) {
      if (!audio) {
        return;
      }

      try {
        userWantsPlay = true;

        if (!isReconnect) {
          clearReconnect();
        }

        setPlayerState(isReconnect ? "reconnecting" : "loading");

        if (isReconnect || !audio.currentSrc) {
          audio.src = STREAM_URL + "?ts=" + Date.now();
          audio.load();
        }

        await audio.play();
      } catch (e) {
        if (userWantsPlay) {
          scheduleReconnect("play-failed");
        } else {
          setPlayerState("stopped");
        }
      }
    }

    function scheduleReconnect(reason) {
      if (!userWantsPlay) {
        return;
      }

      const now = Date.now();
      if (now < reconnectLockUntil) {
        return;
      }

      if (reason === "suspend") {
        return;
      }

      window.clearTimeout(reconnectTimer);
      reconnectAttempt++;
      wasRecovering = true;
      reconnectLockUntil = now + 3500;

      if (reconnectAttempt > 8) {
        setPlayerState("error", "Stream unavailable. Tap Play again.");
        userWantsPlay = false;
        stopWatchdog();
        return;
      }

      const delay = Math.min(1200 + (reconnectAttempt * 800), 7000);
      setPlayerState("reconnecting", "Reconnecting to FactoryXradio...");
      reconnectTimer = window.setTimeout(() => {
        if (!userWantsPlay) {
          return;
        }

        try {
          audio.pause();
          audio.src = STREAM_URL + "?recover=" + Date.now();
          audio.load();
        } catch (e) {
        }

        playStream(true);
      }, delay);
    }

    async function toggleStream() {
      if (!audio) {
        return;
      }

      playButton.classList.remove("ripple");
      void playButton.offsetWidth;
      playButton.classList.add("ripple");

      if (audio.paused && currentState !== "loading" && currentState !== "reconnecting") {
        playStream(false);
      } else if (!audio.paused) {
        userWantsPlay = false;
        clearReconnect();
        stopWatchdog();
        audio.pause();
      }
    }

    function shareStream() {
      const url = window.location.origin + "/live";
      if (navigator.share) {
        navigator.share({ title: "FactoryXradio", text: "Listen live to FactoryXradio", url });
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => {
          showPlayerMessage("Stream link copied", false);
        });
      } else {
        prompt("Copy stream link:", url);
      }
    }

    playButton.addEventListener("click", toggleStream);
    shareButton.addEventListener("click", shareStream);

    window.addEventListener("beforeinstallprompt", function(event) {
      event.preventDefault();
      deferredInstallPrompt = event;
      updateInstallUi();
    });

    if (installAppButton) {
      installAppButton.addEventListener("click", async function() {
        if (isStandaloneApp()) {
          updateInstallUi();
          return;
        }

        if (!deferredInstallPrompt) {
          showInstallGuide(true);
          return;
        }

        try {
          deferredInstallPrompt.prompt();
          await deferredInstallPrompt.userChoice;
        } catch (e) {
          showInstallGuide(true);
        }

        deferredInstallPrompt = null;
        updateInstallUi();
      });
    }

    window.addEventListener("appinstalled", function() {
      deferredInstallPrompt = null;
      installNudgeShown = true;
      window.clearTimeout(installNudgeTimer);
      if (installAppButton) {
        installAppButton.hidden = true;
      }
      hideInstallHelp();
      showPlayerMessage("FactoryXradio app installed", false);
    });

    if (volumeSlider) {
      volumeSlider.addEventListener("input", () => {
        if (audio) {
          audio.volume = Math.max(0, Math.min(1, Number(volumeSlider.value) / 100));
        }
      });
      if (audio) {
        audio.volume = Math.max(0, Math.min(1, Number(volumeSlider.value) / 100));
      }
    }

    audio.addEventListener("progress", () => {
      lastWatchdogActivity = Date.now();
    });

    audio.addEventListener("canplay", () => {
      lastWatchdogActivity = Date.now();
      lastReadyState = audio.readyState;
    });

    audio.addEventListener("timeupdate", () => {
      lastWatchdogActivity = Date.now();
    });

    audio.addEventListener("playing", () => {
      const recovered = wasRecovering || reconnectAttempt > 0;
      reconnectAttempt = 0;
      wasRecovering = false;
      reconnectLockUntil = 0;
      lastWatchdogActivity = Date.now();
      lastReadyState = audio.readyState;
      setPlayerState("playing");
      startWatchdog();
      scheduleInstallNudge();

      if (recovered) {
        showPlayerMessage("Connection restored", false);
      }
    });

    audio.addEventListener("pause", () => {
      if (!userWantsPlay) {
        setPlayerState("stopped");
        stopWatchdog();
      }
    });

    audio.addEventListener("waiting", () => {
      if (userWantsPlay) {
        setPlayerState("loading", "Buffering live stream...");
      }
    });

    audio.addEventListener("stalled", () => {
      if (userWantsPlay) {
        window.clearTimeout(reconnectTimer);
        reconnectTimer = window.setTimeout(() => {
          if (userWantsPlay && audio && !audio.paused && audio.readyState < HTMLMediaElement.HAVE_FUTURE_DATA) {
            scheduleReconnect("stalled");
          }
        }, 8000);
      }
    });

    audio.addEventListener("ended", () => {
      if (userWantsPlay) {
        scheduleReconnect("ended");
      }
    });

    audio.addEventListener("error", () => {
      if (userWantsPlay) {
        scheduleReconnect("error");
      } else {
        setPlayerState("error", "Stream unavailable. Tap Play again.");
      }
    });

    audio.addEventListener("suspend", () => {
      // Normal browser behaviour: the media pipeline may suspend buffering
      // while playback is still healthy. Do not reconnect here.
    });

    audio.addEventListener("emptied", () => {
      if (userWantsPlay) {
        scheduleReconnect("emptied");
      }
    });

    window.addEventListener("online", () => {
      if (userWantsPlay) {
        scheduleReconnect("online");
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (userWantsPlay && !document.hidden) {
        window.setTimeout(() => {
          if (!userWantsPlay || !audio) {
            return;
          }

          if (audio.paused) {
            showPlayerMessage("Resuming live stream...", false);
            playStream(true);
          } else if (audio.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
                     audio.networkState === HTMLMediaElement.NETWORK_NO_SOURCE) {
            showPlayerMessage("Checking live stream...", false);
            scheduleReconnect("visibility");
          }
        }, 1200);
      }
    });

    window.addEventListener("pagehide", () => {
      window.clearTimeout(reconnectTimer);
      stopWatchdog();
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("/sw.js").then(function() {
          updateInstallUi();
          return navigator.serviceWorker.ready;
        }).then(function() {
          updateInstallUi();
        }).catch(function() {
          // Keep the radio player working even when service worker registration fails.
          updateInstallUi();
        });
      });

      navigator.serviceWorker.addEventListener("controllerchange", function() {
        updateInstallUi();
      });
    }

    window.setTimeout(updateInstallUi, 1500);
    window.setTimeout(updateInstallUi, 5000);
    updateInstallUi();
    document.getElementById("year").textContent = new Date().getFullYear();
    setCover("cover_default.jpg");
    setPlayerState("stopped");
    loadNowPlaying();
    setInterval(loadNowPlaying, 10000);
  </script>
</body>
</html>
